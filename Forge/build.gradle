buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.6'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Opcodes
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.FieldVisitor
import org.objectweb.asm.Handle
import org.objectweb.asm.Label
import org.objectweb.asm.MethodVisitor

evaluationDependsOn(':Api')
evaluationDependsOn(':Modern-Common')

// ---- Port version wiring ------------------------------------
// The Forge module has its own SemVer (the "port" version), distinct
// from the upstream BTW / 1.5.2 modVersion. Jar name and mods.toml both
// read from this.
version = project.portVersion
// Jar layout: BetterThanWolves-1.20.1-0.1.0-alpha.1.jar
base {
    archivesName = "${project.portArchiveName}-${project.portMcVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Define source sets BEFORE minecraft {} so 'fc' and 'devModernCommon' are available in mods {} block
sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        // Generated data (loot tables, recipes, tags) ride on the main
        // resources output. Datapack providers write into
        // src/generated/resources/ via `runData`; we keep it as an
        // additional resource srcDir so the gen output is packaged
        // into the jar alongside hand-authored resources.
        resources.srcDirs = ['src/main/resources', 'src/generated/resources']
    }
    // FC source set — holds remapped FC class files so ForgeGradle's
    // TRANSFORMER classloader includes them in the mod's module layer.
    fc {
        resources.srcDirs = []
    }
    // FCMOD-INTEGRATION(1.20.1): dev-run: the dev view of Modern-Common. syncDevModernCommon fills its classes
    // dir with Modern-Common's output minus the shadow list (modernCommonRuntime, the copySpec the jar uses), and
    // the dev runs load it instead of Modern-Common's own output, which only :Modern-Common:compileJava writes.
    // Both srcDirs are empty, so its compile and resources tasks are always NO-SOURCE, and ForgeGradle's
    // makeSrcDirs (Utils.java:399-404) creates no Forge/src/devModernCommon.
    devModernCommon {
        java.srcDirs = []
        resources.srcDirs = []
    }
}

// Generate the mixin refmap so method/field references in @Inject/@At
// annotations get remapped from MCP names (dev) to SRG names (prod jar).
mixin {
    add sourceSets.main, 'betterthanwolves.refmap.json'
    config 'betterthanwolves.mixins.json'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            arg '--mixin.config=betterthanwolves.mixins.json'
            // Disable HotSpot's fast-throw NPE optimization. After ~15
            // exceptions at the same bytecode location, the JIT starts
            // throwing pre-allocated NPE instances with EMPTY stack
            // traces, making caught exceptions unactionable. With FC
            // bridge code triggering tight per-tick exception loops,
            // this is essential for diagnosis.
            jvmArg '-XX:-OmitStackTraceInFastThrow'
            mods {
                betterthanwolves {
                    source sourceSets.main
                    source project(':Api').sourceSets.main
                    // Dev class precedence: securejarhandler's UnionFileSystem searches these
                    // sources in REVERSE declaration order (UnionFileSystem.java:124-127, "later
                    // elements are first in search order"), so devModernCommon, declared last,
                    // wins every btw.modern collision with fc. It is Modern-Common's output minus
                    // the shadow list (syncDevModernCommon, with the jar's own copySpec
                    // modernCommonRuntime), so the frozen classes that must win (Entity hierarchy,
                    // AI/path helpers, ...) exist only in fc, exactly as in the jar. Never list
                    // project(':Modern-Common').sourceSets.main here: the mods{} order guard
                    // (afterEvaluate, below syncDevModernCommon) fails the build if a run does, or
                    // if devModernCommon does not come after fc.
                    source sourceSets.fc
                    source sourceSets.devModernCommon
                }
            }
        }
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            arg '--mixin.config=betterthanwolves.mixins.json'
            // See server { } block — needed so caught NPEs in tight
            // tick loops still carry their stack trace.
            jvmArg '-XX:-OmitStackTraceInFastThrow'
            mods {
                betterthanwolves {
                    source sourceSets.main
                    source project(':Api').sourceSets.main
                    // Dev class precedence: same order and rule as the server run above
                    // (reverse search order -> devModernCommon wins unless the class is on the
                    // shadow list, which keeps it out of that copy; the jar matches).
                    source sourceSets.fc
                    source sourceSets.devModernCommon
                }
            }
        }
        // Data-gen run: `gradlew :Forge:runData` invokes our
        // GatherDataEvent subscriber. Generated datapack content lands in
        // src/generated/resources/ and is then picked up by the main
        // resources srcDir (see sourceSets { main { resources } }).
        data {
            workingDirectory project.file('run/data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // FCMOD-INTEGRATION(1.20.1): mod compat: the same refmap remap as the server and client runs.
            // Serene Seasons, GlitchCore and Cold Sweat ship SRG refmaps with defaultRequire 1, so
            // `runData -PbtwDevMods=sereneseasons,coldsweat` fails to apply their mixins without it.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            args '--mod', 'betterthanwolves', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods {
                betterthanwolves {
                    source sourceSets.main
                    source project(':Api').sourceSets.main
                    // Same order and precedence rule as the server/client runs above.
                    source sourceSets.fc
                    source sourceSets.devModernCommon
                }
            }
        }
    }
}

// --- Shadow: remap FC bytecode btw.api.* -> btw.modern.* ---

task remapFcCode(type: ShadowJar) {
    description = 'Remaps btw.api.* to btw.modern.* in FC code and packages it'
    archiveBaseName = 'fc-remapped'
    archiveClassifier = ''
    // No version in the name: versioned jars accumulated in build/remapped
    // across version bumps, and extractFcClasses (first-in-wins) extracted
    // the OLDEST jar's classes over the current build's.
    archiveVersion = ''
    destinationDirectory = file("$buildDir/remapped")

    // FC code from the subproject modules.
    // Client vs Server duplicates: every class Server compiles (318) also exists in
    // Client (Common shares none with either). These are child specs walked in
    // declaration order under DuplicatesStrategy.EXCLUDE (first copy wins), so the
    // CLIENT variant of every duplicated class is the one in the fc set, for dev
    // runs and the jar, on both physical sides; Server's output contributes no
    // class. Client is the intended winner: it is the 1.5.2 client-jar code, which
    // also runs the integrated server, and it carries the client-only members
    // (render/icon/particle hooks) the Forge client bridge calls. Where a Client
    // copy still declares a 4.B narrow hook overload that only the Server copy
    // widened (FCEntityCreeper/Pig/Zombie), widenFcHookDescriptors (c) widens it.
    from(project(':Client').sourceSets.main.output) { exclude 'btw/api/**' }
    from(project(':Common').sourceSets.main.output) { exclude 'btw/api/**' }
    from(project(':Server').sourceSets.main.output) { exclude 'btw/api/**' }

    // Vanilla MC 1.5.2 AI/pathfinding classes (with FC patches) from the
    // root project. Only include classes that Modern-Common has as dead
    // stubs — EntityAI*, Path*, EntityLookHelper, EntitySenses, plus
    // supporting classes they depend on (RandomPositionGenerator, etc.).
    // Do NOT include Block, Entity, World, Minecraft, etc. — Modern-Common
    // provides bridge implementations for those.
    from(rootProject.file('build/classes/java/main')) {
        include 'net/minecraft/src/EntityAI*.class'
        exclude 'net/minecraft/src/EntityAITasks*.class'
        include 'net/minecraft/src/PathNavigate*.class'
        include 'net/minecraft/src/PathEntity*.class'
        include 'net/minecraft/src/PathPoint*.class'
        include 'net/minecraft/src/PathFinder*.class'
        // EntitySenses excluded — Modern-Common provides a bridge stub
        // with canSee()=true (needed so AI targeting works).
        // EntityLookHelper is now included (stub was deleted from dev
        // classpath; vanilla version has the (EntityLiving) constructor
        // that EntityLiving.<init> calls).
        include 'net/minecraft/src/EntityLookHelper*.class'
        include 'net/minecraft/src/EntityMoveHelper*.class'
        include 'net/minecraft/src/EntityJumpHelper*.class'
        include 'net/minecraft/src/RandomPositionGenerator*.class'
        include 'net/minecraft/src/MCHash*.class'
        include 'net/minecraft/src/IntHash*.class'
        include 'net/minecraft/src/IEntitySelector*.class'
        // FC's vanilla 1.5.2 Entity — has the canonical moveEntity
        // collision-clip + step-up + updateFallState that we need.
        // Modern-Common's Entity stub is on the shadow list (modernCommonRuntime,
        // kept out of the jar and of the dev view) so the vanilla version wins.
        //
        // EntityLiving is ALSO swapped so that vanilla's real
        // writeEntityToNBT / readEntityFromNBT actually persist health,
        // motion, combat state, etc. A no-op stub would make the NBT
        // save path "succeed" but silently lose state on load.
        // Access-level conflicts (protected fields accessed cross-class)
        // are fixed by openUpEntityAccess running ASM promotion (an action of
        // extractFcClasses, after its Sync).
        //
        // NOT swapped:
        //   - AxisAlignedBB: vanilla has PROTECTED constructor, FC code
        //     calls `new AxisAlignedBB(...)` directly and would fail.
        include 'net/minecraft/src/Entity.class'
        include 'net/minecraft/src/EntityLiving.class'
        // EntityCreature and EntityMob carry FCMOD helper methods
        // (EntityCreatureEntityInit, CheckForCatchFireInSun, etc.)
        // that FC subclasses call directly to bypass virtual dispatch.
        // Must be the vanilla versions so those helpers resolve.
        include 'net/minecraft/src/EntityCreature.class'
        include 'net/minecraft/src/EntityMob.class'
        // EntityAgeable and EntityAnimal carry FCMOD helpers used by
        // FCEntityPig/Cow/Sheep/Chicken/Wolf — GetHungerLevel(),
        // SetHungerLevel(), IsTemptingItem(), grazing animation state,
        // etc. — backed by DataWatcher slot 21. FC render code
        // (FCEntityPig.getTexture) calls GetHungerLevel() to switch
        // between fed/hungry textures.
        include 'net/minecraft/src/EntityAgeable.class'
        include 'net/minecraft/src/EntityAnimal.class'
        // Concrete mob/animal classes — Modern-Common's stubs don't call
        // setSize in their constructors, so vanilla 1.5.2 EntityAgeable's
        // sentinel `m_fAdultWidth = -1.0F` never gets overwritten, and
        // readEntityFromNBT → setGrowingAge → AdjustedSizeToScale eventually
        // calls setSize(-1.0, 0.0) which corrupts the bounding box and
        // makes the entity fall through everything.
        include 'net/minecraft/src/EntityPig.class'
        include 'net/minecraft/src/EntityCow.class'
        include 'net/minecraft/src/EntitySheep.class'
        include 'net/minecraft/src/EntityChicken.class'
        include 'net/minecraft/src/EntityWolf.class'
        include 'net/minecraft/src/EntityOcelot.class'
        include 'net/minecraft/src/EntityMooshroom.class'
        include 'net/minecraft/src/EntityVillager.class'
        include 'net/minecraft/src/EntityZombie.class'
        include 'net/minecraft/src/EntitySkeleton.class'
        include 'net/minecraft/src/EntityCreeper.class'
        include 'net/minecraft/src/EntityEnderman.class'
        include 'net/minecraft/src/EntitySpider.class'
        include 'net/minecraft/src/EntityCaveSpider.class'
        include 'net/minecraft/src/EntityWitch.class'
        include 'net/minecraft/src/EntityPigZombie.class'
        include 'net/minecraft/src/EntityWither.class'
        include 'net/minecraft/src/EntitySlime.class'
        include 'net/minecraft/src/EntityMagmaCube.class'
        include 'net/minecraft/src/EntityGhast.class'
        include 'net/minecraft/src/EntityBlaze.class'
        include 'net/minecraft/src/EntitySilverfish.class'
        include 'net/minecraft/src/EntityBat.class'
        include 'net/minecraft/src/EntitySquid.class'
        include 'net/minecraft/src/EntitySnowman.class'
        include 'net/minecraft/src/EntityIronGolem.class'
        include 'net/minecraft/src/EntityAmbientCreature.class'
        include 'net/minecraft/src/EntityWaterMob.class'
        include 'net/minecraft/src/EntityGolem.class'
        include 'net/minecraft/src/EntityFlying.class'
        include 'net/minecraft/src/EntityTameable.class'
        // Direct Entity subclasses — vanilla 1.5.2 declares writeEntityToNBT
        // and readEntityFromNBT abstract on Entity, so the Modern-Common
        // stubs (which inherit them as abstract) hit AbstractMethodError
        // every time FCEntityStateCodec or ProxyEntity tries to serialize
        // them for save/sync. Swap to vanilla so the real impls are present.
        include 'net/minecraft/src/EntityArrow.class'
        include 'net/minecraft/src/EntityBoat.class'
        include 'net/minecraft/src/EntityFX.class'
        include 'net/minecraft/src/EntityFallingSand.class'
        include 'net/minecraft/src/EntityFireball.class'
        include 'net/minecraft/src/EntityFishHook.class'
        include 'net/minecraft/src/EntityItem.class'
        include 'net/minecraft/src/EntityMinecart.class'
        include 'net/minecraft/src/EntityPainting.class'
        include 'net/minecraft/src/EntityTNTPrimed.class'
        include 'net/minecraft/src/EntityThrowable.class'
        include 'net/minecraft/src/EntityWeatherEffect.class'
        include 'net/minecraft/src/EntityXPOrb.class'
        include 'net/minecraft/src/FCEntityLightningBolt.class'
        // FCEntityLightningBolt extends EntityLightningBolt, which extends
        // EntityWeatherEffect. ModelBat uses reflection to look up methods
        // on EntityLightningBolt, so the class must be loadable.
        include 'net/minecraft/src/EntityLightningBolt.class'
        // FCMOD utility classes referenced by vanilla 1.5.2 entity code:
        //   - FCUtilsWorld: EntityLiving.getSpeedModifier (mud/path/water slowdowns)
        //   - FCUtilsMisc: EntityAnimal/EntityAgeable behaviour helpers
        // Modern-Common doesn't stub these, so the real vanilla versions
        // get pulled in via remap.
        include 'net/minecraft/src/FCUtilsWorld.class'
        include 'net/minecraft/src/FCUtilsMisc.class'
        // Vanilla EntityLiving references CombatTracker to record damage
        // events used by death messages and statistics. CombatTracker
        // depends on DamageSource — we leave DamageSource as Modern-
        // Common's stub (compatible signature).
        include 'net/minecraft/src/CombatTracker.class'
        include 'net/minecraft/src/CombatEntry.class'
        // Vanilla EntityLiving constructor creates EntityBodyHelper.
        // Modern-Common has no stub, so include vanilla's directly.
        include 'net/minecraft/src/EntityBodyHelper.class'
        // Vanilla EntityLiving.CheckForHeadDrop() and .attackEntityFrom()
        // reference FCDamageSourceCustom static fields (m_DamageSourceChoppingBlock
        // etc.). The vanilla 1.5.2 class is a flat DamageSource subclass;
        // it depends only on DamageSource (already stubbed in Modern-Common).
        include 'net/minecraft/src/FCDamageSourceCustom.class'
        // Vanilla EntityMob implements IMob. IMob has a static-final
        // FilterIMob field. Both must be present so EntityMob loads.
        include 'net/minecraft/src/IMob.class'
        include 'net/minecraft/src/FilterIMob.class'
        // Tag interfaces implemented by various vanilla 1.5.2 mob classes:
        //   - IBossDisplayData: EntityWither, EntityDragon
        //   - INpc, IMerchant: EntityVillager
        // Without them the mob classes fail to link.
        include 'net/minecraft/src/IBossDisplayData.class'
        include 'net/minecraft/src/INpc.class'
        include 'net/minecraft/src/IMerchant.class'
        // Projectile subclasses referenced by vanilla mob classes:
        //   - EntitySmallFireball: EntityBlaze.shoots, EntityGhast hit code
        //   - EntityLargeFireball: EntityGhast.shoots
        //   - EntityWitherSkull:   EntityWither.shoots
        //   - FCEntityWitherSkull: vanilla EntityWither.java:479 directly
        //     instantiates this FC subclass via `new FCEntityWitherSkull(...)`
        include 'net/minecraft/src/EntitySmallFireball.class'
        include 'net/minecraft/src/EntityLargeFireball.class'
        include 'net/minecraft/src/EntityWitherSkull.class'
        // Vanilla 1.5.2 has FCMOD-patched subclass relationships where the
        // original vanilla class extends an FC subclass:
        //   - EntityMooshroom extends FCEntityCow
        //   - EntityPigZombie extends FCEntityZombie
        //   - EntityMagmaCube extends FCEntitySlime
        // So when we swap the vanilla parent, we MUST also bring in the
        // FCEntity* version to satisfy the linker. Plus EntityWither has
        // EntityWitherAttackFilter as a static-final field. The shotgun
        // include below brings in every FCEntity*.class from Src/ — they
        // all relocate cleanly into btw.modern.* and only depend on classes
        // we already have.
        include 'net/minecraft/src/FCEntity*.class'
        include 'net/minecraft/src/EntityWitherAttackFilter.class'
        // EntitySheep instantiates `new ContainerSheep(this)` for crafting.
        // Container itself is a Modern-Common stub; ContainerSheep is a
        // tiny vanilla subclass of Container.
        include 'net/minecraft/src/ContainerSheep.class'
        // Thrown projectile subclasses spawned by various mobs:
        //   - EntitySnowball: EntitySnowman
        //   - EntityEgg: EntityChicken (random egg drop)
        //   - EntityEnderPearl: EntityEnderman
        //   - EntityExpBottle: villager XP throw
        include 'net/minecraft/src/EntitySnowball.class'
        include 'net/minecraft/src/EntityEgg.class'
        include 'net/minecraft/src/EntityEnderPearl.class'
        include 'net/minecraft/src/EntityExpBottle.class'
        // Tuple is a small generic pair helper used by EntityVillager's
        // trade randomizer (and some other vanilla 1.5.2 code).
        include 'net/minecraft/src/Tuple.class'
        // ChunkCache (the read-only IBlockAccess World.getEntityPathToXYZ hands to
        // PathFinder) is deliberately NOT merged: 1.5.2's copy clips y to [0, 256),
        // so PathFinder saw air below y=0. Modern-Common's btw.modern.ChunkCache is a
        // port that clips to World.getFcMin/MaxBuildHeight and is the only copy.
        // Path is the internal priority queue used by PathFinder.
        include 'net/minecraft/src/Path.class'
        include 'net/minecraft/src/ModelBox.class'
        include 'net/minecraft/src/TexturedQuad.class'
        include 'net/minecraft/src/PositionTextureVertex.class'
        // NOTE: the nine Container* below plus InventoryMerchant, SlotMerchantResult,
        // SlotCrafting, IMerchant, IEntitySelector, EntityAIBase and
        // EntityAIControlledByPlayer also exist in Modern-Common and are NOT on the
        // shadow list, so Modern-Common's copies win in dev AND in the jar (jar{}
        // "Class precedence"); these frozen copies ship nowhere. Shadow-list a class
        // (one exclude line in modernCommonRuntime) to make its frozen copy win.
        include 'net/minecraft/src/ContainerMerchant.class'
        include 'net/minecraft/src/ContainerFurnace.class'
        include 'net/minecraft/src/ContainerDispenser.class'
        include 'net/minecraft/src/ContainerHopper.class'
        include 'net/minecraft/src/ContainerBrewingStand.class'
        include 'net/minecraft/src/ContainerBeacon.class'
        include 'net/minecraft/src/ContainerRepair.class'
        include 'net/minecraft/src/ContainerEnchantment.class'
        include 'net/minecraft/src/ContainerChest.class'
        include 'net/minecraft/src/InventoryMerchant.class'
        include 'net/minecraft/src/SlotMerchantResult.class'
        include 'net/minecraft/src/SlotFurnace.class'
        include 'net/minecraft/src/SlotBrewingStandPotion.class'
        include 'net/minecraft/src/SlotBrewingStandIngredient.class'
        include 'net/minecraft/src/SlotArmor.class'
        include 'net/minecraft/src/SlotCrafting.class'
        // Frozen Entity.setFire() calls EnchantmentProtection.func_92093_a and
        // EntityLiving.MeleeAttack calls EnchantmentThorns.func_92096_a
        // UNCONDITIONALLY — without these classes the first burning zombie /
        // first mob melee hit raises NoClassDefFoundError (link-audit P0).
        include 'net/minecraft/src/EnchantmentProtection.class'
        include 'net/minecraft/src/EnchantmentThorns.class'
        // EntityPainting extends EntityHanging; FCEntityCanvas.onValidSurface
        // does `instanceof EntityPainting`, which loads the superclass chain.
        include 'net/minecraft/src/EntityHanging.class'
        // EntityMinecart.createMinecart news all six subclasses; reachable via
        // FCItemMinecart.OnItemUsedByBlockDispenser (Block Dispenser).
        include 'net/minecraft/src/EntityMinecartEmpty.class'
        include 'net/minecraft/src/EntityMinecartChest.class'
        include 'net/minecraft/src/EntityMinecartFurnace.class'
        include 'net/minecraft/src/EntityMinecartHopper.class'
        include 'net/minecraft/src/EntityMinecartTNT.class'
        include 'net/minecraft/src/EntityMinecartMobSpawner.class'
        include 'net/minecraft/src/EntityMinecartContainer.class'
        include 'net/minecraft/src/EntityMinecartMobSpawnerLogic.class'
        // Hopper interface — frozen EntityMinecartHopper (and hopper TE) implement it;
        // without it EntityList.<clinit> loading EntityMinecartHopper NoClassDefFoundErrors.
        include 'net/minecraft/src/Hopper.class'
        include 'net/minecraft/src/MobSpawnerBaseLogic.class'
        include 'net/minecraft/src/WeightedRandomMinecart.class'
        // Crash-report Callables used by EntityLiving.updatePotionEffects'
        // catch block — without them a potion-tick exception is masked by
        // NoClassDefFoundError instead of producing the real crash report.
        include 'net/minecraft/src/CallableEffect*.class'
        // WatchableObject: frozen Entity.FlagAllWatchedObjectsDirty references it (dead path,
        // but the class must resolve for the audit); self-contained, no extra deps.
        include 'net/minecraft/src/WatchableObject.class'
    }
    from(rootProject.file('build/classes/java/server')) {
        include 'net/minecraft/src/EntityAI*.class'
        exclude 'net/minecraft/src/EntityAITasks*.class'
        include 'net/minecraft/src/PathNavigate*.class'
        include 'net/minecraft/src/PathEntity*.class'
        include 'net/minecraft/src/PathPoint*.class'
        include 'net/minecraft/src/PathFinder*.class'
        // EntitySenses excluded — Modern-Common provides a bridge stub
        // with canSee()=true (needed so AI targeting works).
        // EntityLookHelper is now included (stub was deleted from dev
        // classpath; vanilla version has the (EntityLiving) constructor
        // that EntityLiving.<init> calls).
        include 'net/minecraft/src/EntityLookHelper*.class'
        include 'net/minecraft/src/EntityMoveHelper*.class'
        include 'net/minecraft/src/EntityJumpHelper*.class'
        include 'net/minecraft/src/RandomPositionGenerator*.class'
        include 'net/minecraft/src/MCHash*.class'
        include 'net/minecraft/src/IntHash*.class'
        include 'net/minecraft/src/IEntitySelector*.class'
        // See client comment above.
        include 'net/minecraft/src/Entity.class'
        include 'net/minecraft/src/EntityLiving.class'
        // EntityCreature and EntityMob carry FCMOD helper methods
        // (EntityCreatureEntityInit, CheckForCatchFireInSun, etc.)
        // that FC subclasses call directly to bypass virtual dispatch.
        // Must be the vanilla versions so those helpers resolve.
        include 'net/minecraft/src/EntityCreature.class'
        include 'net/minecraft/src/EntityMob.class'
        // EntityAgeable and EntityAnimal carry FCMOD helpers used by
        // FCEntityPig/Cow/Sheep/Chicken/Wolf — GetHungerLevel(),
        // SetHungerLevel(), IsTemptingItem(), grazing animation state,
        // etc. — backed by DataWatcher slot 21. FC render code
        // (FCEntityPig.getTexture) calls GetHungerLevel() to switch
        // between fed/hungry textures.
        include 'net/minecraft/src/EntityAgeable.class'
        include 'net/minecraft/src/EntityAnimal.class'
        // Concrete mob/animal classes — Modern-Common's stubs don't call
        // setSize in their constructors, so vanilla 1.5.2 EntityAgeable's
        // sentinel `m_fAdultWidth = -1.0F` never gets overwritten, and
        // readEntityFromNBT → setGrowingAge → AdjustedSizeToScale eventually
        // calls setSize(-1.0, 0.0) which corrupts the bounding box and
        // makes the entity fall through everything.
        include 'net/minecraft/src/EntityPig.class'
        include 'net/minecraft/src/EntityCow.class'
        include 'net/minecraft/src/EntitySheep.class'
        include 'net/minecraft/src/EntityChicken.class'
        include 'net/minecraft/src/EntityWolf.class'
        include 'net/minecraft/src/EntityOcelot.class'
        include 'net/minecraft/src/EntityMooshroom.class'
        include 'net/minecraft/src/EntityVillager.class'
        include 'net/minecraft/src/EntityZombie.class'
        include 'net/minecraft/src/EntitySkeleton.class'
        include 'net/minecraft/src/EntityCreeper.class'
        include 'net/minecraft/src/EntityEnderman.class'
        include 'net/minecraft/src/EntitySpider.class'
        include 'net/minecraft/src/EntityCaveSpider.class'
        include 'net/minecraft/src/EntityWitch.class'
        include 'net/minecraft/src/EntityPigZombie.class'
        include 'net/minecraft/src/EntityWither.class'
        include 'net/minecraft/src/EntitySlime.class'
        include 'net/minecraft/src/EntityMagmaCube.class'
        include 'net/minecraft/src/EntityGhast.class'
        include 'net/minecraft/src/EntityBlaze.class'
        include 'net/minecraft/src/EntitySilverfish.class'
        include 'net/minecraft/src/EntityBat.class'
        include 'net/minecraft/src/EntitySquid.class'
        include 'net/minecraft/src/EntitySnowman.class'
        include 'net/minecraft/src/EntityIronGolem.class'
        include 'net/minecraft/src/EntityAmbientCreature.class'
        include 'net/minecraft/src/EntityWaterMob.class'
        include 'net/minecraft/src/EntityGolem.class'
        include 'net/minecraft/src/EntityFlying.class'
        include 'net/minecraft/src/EntityTameable.class'
        // Direct Entity subclasses — vanilla 1.5.2 declares writeEntityToNBT
        // and readEntityFromNBT abstract on Entity, so the Modern-Common
        // stubs (which inherit them as abstract) hit AbstractMethodError
        // every time FCEntityStateCodec or ProxyEntity tries to serialize
        // them for save/sync. Swap to vanilla so the real impls are present.
        include 'net/minecraft/src/EntityArrow.class'
        include 'net/minecraft/src/EntityBoat.class'
        include 'net/minecraft/src/EntityFX.class'
        include 'net/minecraft/src/EntityFallingSand.class'
        include 'net/minecraft/src/EntityFireball.class'
        include 'net/minecraft/src/EntityFishHook.class'
        include 'net/minecraft/src/EntityItem.class'
        include 'net/minecraft/src/EntityMinecart.class'
        include 'net/minecraft/src/EntityPainting.class'
        include 'net/minecraft/src/EntityTNTPrimed.class'
        include 'net/minecraft/src/EntityThrowable.class'
        include 'net/minecraft/src/EntityWeatherEffect.class'
        include 'net/minecraft/src/EntityXPOrb.class'
        include 'net/minecraft/src/FCEntityLightningBolt.class'
        // FCEntityLightningBolt extends EntityLightningBolt, which extends
        // EntityWeatherEffect. ModelBat uses reflection to look up methods
        // on EntityLightningBolt, so the class must be loadable.
        include 'net/minecraft/src/EntityLightningBolt.class'
        // FCMOD utility classes referenced by vanilla 1.5.2 entity code:
        //   - FCUtilsWorld: EntityLiving.getSpeedModifier (mud/path/water slowdowns)
        //   - FCUtilsMisc: EntityAnimal/EntityAgeable behaviour helpers
        // Modern-Common doesn't stub these, so the real vanilla versions
        // get pulled in via remap.
        include 'net/minecraft/src/FCUtilsWorld.class'
        include 'net/minecraft/src/FCUtilsMisc.class'
        // Vanilla EntityLiving references CombatTracker to record damage
        // events used by death messages and statistics. CombatTracker
        // depends on DamageSource — we leave DamageSource as Modern-
        // Common's stub (compatible signature).
        include 'net/minecraft/src/CombatTracker.class'
        include 'net/minecraft/src/CombatEntry.class'
        // Vanilla EntityLiving constructor creates EntityBodyHelper.
        // Modern-Common has no stub, so include vanilla's directly.
        include 'net/minecraft/src/EntityBodyHelper.class'
        // Vanilla EntityLiving.CheckForHeadDrop() and .attackEntityFrom()
        // reference FCDamageSourceCustom static fields (m_DamageSourceChoppingBlock
        // etc.). The vanilla 1.5.2 class is a flat DamageSource subclass;
        // it depends only on DamageSource (already stubbed in Modern-Common).
        include 'net/minecraft/src/FCDamageSourceCustom.class'
        // Vanilla EntityMob implements IMob. IMob has a static-final
        // FilterIMob field. Both must be present so EntityMob loads.
        include 'net/minecraft/src/IMob.class'
        include 'net/minecraft/src/FilterIMob.class'
        // Tag interfaces implemented by various vanilla 1.5.2 mob classes:
        //   - IBossDisplayData: EntityWither, EntityDragon
        //   - INpc, IMerchant: EntityVillager
        // Without them the mob classes fail to link.
        include 'net/minecraft/src/IBossDisplayData.class'
        include 'net/minecraft/src/INpc.class'
        include 'net/minecraft/src/IMerchant.class'
        // Projectile subclasses referenced by vanilla mob classes:
        //   - EntitySmallFireball: EntityBlaze.shoots, EntityGhast hit code
        //   - EntityLargeFireball: EntityGhast.shoots
        //   - EntityWitherSkull:   EntityWither.shoots
        //   - FCEntityWitherSkull: vanilla EntityWither.java:479 directly
        //     instantiates this FC subclass via `new FCEntityWitherSkull(...)`
        include 'net/minecraft/src/EntitySmallFireball.class'
        include 'net/minecraft/src/EntityLargeFireball.class'
        include 'net/minecraft/src/EntityWitherSkull.class'
        // Vanilla 1.5.2 has FCMOD-patched subclass relationships where the
        // original vanilla class extends an FC subclass:
        //   - EntityMooshroom extends FCEntityCow
        //   - EntityPigZombie extends FCEntityZombie
        //   - EntityMagmaCube extends FCEntitySlime
        // So when we swap the vanilla parent, we MUST also bring in the
        // FCEntity* version to satisfy the linker. Plus EntityWither has
        // EntityWitherAttackFilter as a static-final field. The shotgun
        // include below brings in every FCEntity*.class from Src/ — they
        // all relocate cleanly into btw.modern.* and only depend on classes
        // we already have.
        include 'net/minecraft/src/FCEntity*.class'
        include 'net/minecraft/src/EntityWitherAttackFilter.class'
        // EntitySheep instantiates `new ContainerSheep(this)` for crafting.
        // Container itself is a Modern-Common stub; ContainerSheep is a
        // tiny vanilla subclass of Container.
        include 'net/minecraft/src/ContainerSheep.class'
        // Thrown projectile subclasses spawned by various mobs:
        //   - EntitySnowball: EntitySnowman
        //   - EntityEgg: EntityChicken (random egg drop)
        //   - EntityEnderPearl: EntityEnderman
        //   - EntityExpBottle: villager XP throw
        include 'net/minecraft/src/EntitySnowball.class'
        include 'net/minecraft/src/EntityEgg.class'
        include 'net/minecraft/src/EntityEnderPearl.class'
        include 'net/minecraft/src/EntityExpBottle.class'
        // Tuple is a small generic pair helper used by EntityVillager's
        // trade randomizer (and some other vanilla 1.5.2 code).
        include 'net/minecraft/src/Tuple.class'
        // ChunkCache deliberately not merged (Modern-Common's build-range port is the
        // only copy; see the client block above).
        // Path is the internal priority queue used by PathFinder.
        include 'net/minecraft/src/Path.class'
        // Model rendering: vanilla 1.5.2 ModelBox/TexturedQuad compute UV
        // coordinates correctly for the 64x32 texture layout. The Modern-
        // Common ModelRenderer uses these instead of hand-calculating UVs.
        include 'net/minecraft/src/ModelBox.class'
        include 'net/minecraft/src/TexturedQuad.class'
        include 'net/minecraft/src/PositionTextureVertex.class'
        // Container classes for GUI system — FC's displayGUI* methods
        // create these containers which get wrapped by FCContainerMenu.
        // (Shadowed by Modern-Common in dev and jar: see the NOTE in the client block.)
        include 'net/minecraft/src/ContainerMerchant.class'
        include 'net/minecraft/src/ContainerFurnace.class'
        include 'net/minecraft/src/ContainerDispenser.class'
        include 'net/minecraft/src/ContainerHopper.class'
        include 'net/minecraft/src/ContainerBrewingStand.class'
        include 'net/minecraft/src/ContainerBeacon.class'
        include 'net/minecraft/src/ContainerRepair.class'
        include 'net/minecraft/src/ContainerEnchantment.class'
        include 'net/minecraft/src/ContainerChest.class'
        // Supporting classes for containers
        include 'net/minecraft/src/InventoryMerchant.class'
        include 'net/minecraft/src/SlotMerchantResult.class'
        include 'net/minecraft/src/SlotFurnace.class'
        include 'net/minecraft/src/SlotBrewingStandPotion.class'
        include 'net/minecraft/src/SlotBrewingStandIngredient.class'
        include 'net/minecraft/src/SlotArmor.class'
        include 'net/minecraft/src/SlotCrafting.class'
        // Server-side twins of the client-block additions above (see comments there)
        include 'net/minecraft/src/EnchantmentProtection.class'
        include 'net/minecraft/src/EnchantmentThorns.class'
        include 'net/minecraft/src/EntityHanging.class'
        include 'net/minecraft/src/EntityMinecartEmpty.class'
        include 'net/minecraft/src/EntityMinecartChest.class'
        include 'net/minecraft/src/EntityMinecartFurnace.class'
        include 'net/minecraft/src/EntityMinecartHopper.class'
        include 'net/minecraft/src/EntityMinecartTNT.class'
        include 'net/minecraft/src/EntityMinecartMobSpawner.class'
        include 'net/minecraft/src/EntityMinecartContainer.class'
        include 'net/minecraft/src/EntityMinecartMobSpawnerLogic.class'
        // Hopper interface — frozen EntityMinecartHopper (and hopper TE) implement it;
        // without it EntityList.<clinit> loading EntityMinecartHopper NoClassDefFoundErrors.
        include 'net/minecraft/src/Hopper.class'
        include 'net/minecraft/src/MobSpawnerBaseLogic.class'
        include 'net/minecraft/src/WeightedRandomMinecart.class'
        include 'net/minecraft/src/CallableEffect*.class'
        // WatchableObject: frozen Entity.FlagAllWatchedObjectsDirty references it (dead path,
        // but the class must resolve for the audit); self-contained, no extra deps.
        include 'net/minecraft/src/WatchableObject.class'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // NOTE (2026-10-10): since the frozen artifact was regenerated from vanilla/ it
    // references net.minecraft.src.btw.** directly and has no flat FC* classes, so the
    // flat-name relocates below and the FCEntity*, FCUtils*, FCDamageSourceCustom and
    // FCEntityLightningBolt includes above are no-ops, kept pending cleanup.
    // The frozen 1.5.2 artifact (build/classes/java/{main,server}) was compiled
    // BEFORE the FC source restructure, so its bytecode references FLAT FC names
    // (net.minecraft.src.FCX). The general rule below would relocate those to
    // btw.modern.FCX — classes that do not exist. Map each flat name that a
    // LOADABLE frozen class references to its restructured home instead, so the
    // frozen bytecode links against the live FC classes. Specific rules must
    // precede the general net.minecraft.src rule (first match wins).
    // (Member signatures verified identical on both sides — link audit 2026-07-08.)
    relocate 'net.minecraft.src.FCBetterThanWolves', 'net.minecraft.src.btw.core.FCBetterThanWolves'
    relocate 'net.minecraft.src.FCUtilsItem', 'net.minecraft.src.btw.util.FCUtilsItem'
    relocate 'net.minecraft.src.FCUtilsRandomPositionGenerator', 'net.minecraft.src.btw.util.FCUtilsRandomPositionGenerator'
    relocate 'net.minecraft.src.FCBlockSilverfish', 'net.minecraft.src.btw.block.FCBlockSilverfish'
    relocate 'net.minecraft.src.FCBlockMycelium', 'net.minecraft.src.btw.block.FCBlockMycelium'
    relocate 'net.minecraft.src.FCBlockGroundCover', 'net.minecraft.src.btw.block.FCBlockGroundCover'
    // Dead flat-FC graph (mech-power / urn / canvas / lightning FCEntity* copies that
    // nothing instantiates — verified unreachable by the 2026-07-08 link audit). These
    // relocate rules resolve their dangling refs to the restructured classes so the audit
    // reads clean; prefix collisions (FCBlockFire->FCBlockFireStoked, FCBlockLog->...Smouldering,
    // FCBlockAxle->...PowerSource, FCBlockSnowLoose/Solid->...Slab) all map to existing
    // net.minecraft.src.btw.block.* classes, so they are safe.
    relocate 'net.minecraft.src.FCBlockAxle', 'net.minecraft.src.btw.block.FCBlockAxle'
    relocate 'net.minecraft.src.FCBlockAnchor', 'net.minecraft.src.btw.block.FCBlockAnchor'
    relocate 'net.minecraft.src.FCBlockBBQ', 'net.minecraft.src.btw.block.FCBlockBBQ'
    relocate 'net.minecraft.src.FCBlockBlockDispenser', 'net.minecraft.src.btw.block.FCBlockBlockDispenser'
    relocate 'net.minecraft.src.FCBlockLightningRod', 'net.minecraft.src.btw.block.FCBlockLightningRod'
    relocate 'net.minecraft.src.FCBlockLog', 'net.minecraft.src.btw.block.FCBlockLog'
    relocate 'net.minecraft.src.FCBlockPlanter', 'net.minecraft.src.btw.block.FCBlockPlanter'
    relocate 'net.minecraft.src.FCBlockRope', 'net.minecraft.src.btw.block.FCBlockRope'
    relocate 'net.minecraft.src.FCBlockScrewPump', 'net.minecraft.src.btw.block.FCBlockScrewPump'
    relocate 'net.minecraft.src.FCBlockSnowLoose', 'net.minecraft.src.btw.block.FCBlockSnowLoose'
    relocate 'net.minecraft.src.FCBlockSnowSolid', 'net.minecraft.src.btw.block.FCBlockSnowSolid'
    relocate 'net.minecraft.src.FCBlockFire', 'net.minecraft.src.btw.block.FCBlockFire'
    relocate 'net.minecraft.src.FCExplosionMining', 'net.minecraft.src.btw.world.FCExplosionMining'
    relocate 'net.minecraft.src.FCUtilsMechPower', 'net.minecraft.src.btw.util.FCUtilsMechPower'
    relocate 'net.minecraft.src.FCTileEntityPulley', 'net.minecraft.src.btw.tileentity.FCTileEntityPulley'
    relocate 'net.minecraft.src.FCEnumCanvasArt', 'net.minecraft.src.btw.properties.FCEnumCanvasArt'
    relocate 'net.minecraft.src.FCIBlockFluidSource', 'net.minecraft.src.btw.api.FCIBlockFluidSource'
    // Interfaces the flat FCEntity* shotgun-include copies implement (the live restructured
    // entities implement the net.minecraft.src.btw.api versions, which stay put). Without
    // these, loading any flat copy NoClassDefFoundErrors on the missing supertype.
    relocate 'net.minecraft.src.FCIEntityPacketHandler', 'net.minecraft.src.btw.api.FCIEntityPacketHandler'
    relocate 'net.minecraft.src.FCIEntityIgnoreServerValidation', 'net.minecraft.src.btw.api.FCIEntityIgnoreServerValidation'

    // Frozen 1.5.2 Entity / EntityItem / EntityMinecart reference the 1.5.2 server class
    // net.minecraft.server.MinecraftServer (getServer, worldServers, worldServerForDimension,
    // getConfigurationManager, getAllowNether) and WorldServer.getMinecraftServer() returns it
    // (vanilla/client Entity.java:456-459,2394-2397; EntityItem.java:747,769;
    // EntityMinecart.java:260-263). At runtime that name is the MODERN 1.20.1 server (no static
    // getServer(), different members) -> NoSuchMethodError. Retarget to the Modern-Common
    // stand-in FC code already links against (btw.api.MinecraftServer -> btw.modern.MinecraftServer).
    // javap audit 2026-10-10: the ONLY net.minecraft.server.* name in the fc output.
    // tools/LinkAudit.java "FOREIGN net.minecraft REFS" flags any new one (must stay 0).
    relocate 'net.minecraft.server.MinecraftServer', 'btw.modern.MinecraftServer'
    relocate 'btw.api', 'btw.modern'
    // Remap vanilla MC 1.5.2 classes (Entity, EntityAI*, PathNavigate, etc.)
    // into btw.modern.* so FC code can reach the REAL vanilla AI
    // implementations rather than dead Modern-Common stubs.
    // Exclude net.minecraft.src.btw.** — those are FC's own packages
    // and must stay at their original location.
    relocate('net.minecraft.src', 'btw.modern') {
        exclude 'net.minecraft.src.btw.**'
    }
    // Remap GL11 calls in FC code to btw.modern.GL11. FC client renderers call
    // fixed-function GL11 entry points that would abort MC 1.20.1's core-profile
    // context. btw.modern.GL11 keeps a thread-local software matrix stack plus the
    // current color, normal, lightmap coords, GL_TEXTURE-matrix translation,
    // glBlendFunc factors and the TEXTURE_2D (per texture unit) / BLEND / ALPHA_TEST /
    // LIGHTING caps, which the Tessellator applies per captured vertex/quad (the FC
    // TESR/entity capture renderers pick a RenderType from them). Depth/alpha-func/
    // mask/polygon-offset, texture bind/params and immediate-mode begin/vertex calls
    // are no-ops (MC's RenderType owns them).
    relocate 'org.lwjgl.opengl.GL11', 'btw.modern.GL11'
    configurations = []
}

remapFcCode.dependsOn ':Api:compileJava', ':Common:compileJava', ':Client:compileJava', ':Server:compileJava'

// Extract remapped JAR into fc source set so ForgeGradle's classloader loads it.
// Sync (not Copy) from exactly the current archive: Copy over a *.jar glob
// used to merge every stale versioned jar in build/remapped first-in-wins,
// and never purged classes deleted from the remap — dev ran old bytecode.
task extractFcClasses(type: Sync) {
    dependsOn remapFcCode
    from { zipTree(remapFcCode.archiveFile) }
    into sourceSets.fc.output.classesDirs.files.first()
}

// Wire task dependencies
tasks.matching { it.name.startsWith('prepareRun') || it.name.startsWith('run') || it.name == 'classes' }.configureEach {
    dependsOn extractFcClasses
}

// ------------------------------------------------------------------
// The shadow list: the Modern-Common stubs that the frozen 1.5.2 (fc) classes
// must replace. Modern-Common wins every other btw.modern collision, in the jar
// (its child spec is walked before fc's under EXCLUDE, jar { } "Class precedence")
// and in dev runs (securejarhandler searches mods{} sources in reverse declaration
// order). ONE copySpec, shared by the dist jar (`with modernCommonRuntime`) and the
// dev view (syncDevModernCommon), so dev and jar cannot drift. Anything not listed
// resolves to Modern-Common in BOTH dev and jar. AxisAlignedBB is deliberately
// absent (the vanilla ctor is protected). Keep one literal exclude of a
// btw/modern/<Name>.class path per line: tools/LinkAudit.java reads the list from
// this file with a regex (so never quote such a line in a comment).
//
// FC's vanilla 1.5.2 Entity has the full moveEntity collision-clip
// algorithm. We deliberately use it instead of porting/stubbing.
// ------------------------------------------------------------------
def modernCommonRuntime = copySpec {
    from(project(':Modern-Common').sourceSets.main.output)
    exclude 'btw/api/**'
    // Let vanilla versions win for classes with MATCHING constructors
    // and better implementations. Keep Modern-Common's versions only for
    // classes where the bridge uses a different constructor signature
    // (e.g. EntitySenses no-arg; vanilla needs an entity arg). NOTE:
    // EntityLookHelper is NOT kept here — the runtime EntityLiving is FC's
    // (Modern-Common's EntityLiving is excluded below), and it calls
    // new EntityLookHelper(this); Modern-Common's look helper is an empty
    // stub, so FC's real one must win.
    exclude 'btw/modern/PathNavigate.class'
    exclude 'btw/modern/PathEntity.class'
    exclude 'btw/modern/PathPoint.class'
    exclude 'btw/modern/PathFinder.class'
    exclude 'btw/modern/EntityMoveHelper.class'
    exclude 'btw/modern/EntityJumpHelper.class'
    // Frozen EntityTameable's field initializer news EntityAISit(EntityTameable);
    // the Modern-Common shim only has an (EntityLiving) ctor, so every FC wolf
    // construction threw NoSuchMethodError (silently caught — wolves were inert
    // husks). The real 1.5.2 EntityAISit is already in the remap via EntityAI*.
    exclude 'btw/modern/EntityAISit.class'
    // FC's vanilla 1.5.2 Entity/EntityLiving own collision and
    // mob state. Exclude Modern-Common's stubs so FC's versions
    // win in the JAR. Access-level issues are resolved by ASM
    // promotion in openUpEntityAccess. AxisAlignedBB stays
    // Modern-Common because vanilla's constructor is protected.
    exclude 'btw/modern/Entity.class'
    exclude 'btw/modern/EntityLiving.class'
    exclude 'btw/modern/EntityCreature.class'
    exclude 'btw/modern/EntityMob.class'
    exclude 'btw/modern/EntityAgeable.class'
    exclude 'btw/modern/EntityAnimal.class'
    exclude 'btw/modern/EntityPig.class'
    exclude 'btw/modern/EntityCow.class'
    exclude 'btw/modern/EntitySheep.class'
    exclude 'btw/modern/EntityChicken.class'
    exclude 'btw/modern/EntityWolf.class'
    exclude 'btw/modern/EntityOcelot.class'
    exclude 'btw/modern/EntityMooshroom.class'
    exclude 'btw/modern/EntityVillager.class'
    exclude 'btw/modern/EntityZombie.class'
    exclude 'btw/modern/EntitySkeleton.class'
    exclude 'btw/modern/EntityCreeper.class'
    exclude 'btw/modern/EntityEnderman.class'
    exclude 'btw/modern/EntitySpider.class'
    exclude 'btw/modern/EntityCaveSpider.class'
    exclude 'btw/modern/EntityWitch.class'
    exclude 'btw/modern/EntityPigZombie.class'
    exclude 'btw/modern/EntityWither.class'
    exclude 'btw/modern/EntitySlime.class'
    exclude 'btw/modern/EntityMagmaCube.class'
    exclude 'btw/modern/EntityGhast.class'
    exclude 'btw/modern/EntityBlaze.class'
    exclude 'btw/modern/EntitySilverfish.class'
    exclude 'btw/modern/EntityBat.class'
    exclude 'btw/modern/EntitySquid.class'
    exclude 'btw/modern/EntitySnowman.class'
    exclude 'btw/modern/EntityIronGolem.class'
    exclude 'btw/modern/EntityAmbientCreature.class'
    exclude 'btw/modern/EntityWaterMob.class'
    exclude 'btw/modern/EntityGolem.class'
    exclude 'btw/modern/EntityFlying.class'
    exclude 'btw/modern/EntityTameable.class'
    exclude 'btw/modern/EntityArrow.class'
    exclude 'btw/modern/EntityBoat.class'
    exclude 'btw/modern/EntityFX.class'
    exclude 'btw/modern/EntityFallingSand.class'
    exclude 'btw/modern/EntityFireball.class'
    exclude 'btw/modern/EntityFishHook.class'
    exclude 'btw/modern/EntityItem.class'
    exclude 'btw/modern/EntityMinecart.class'
    exclude 'btw/modern/EntityMinecartHopper.class'
    exclude 'btw/modern/EntityPainting.class'
    exclude 'btw/modern/EntityTNTPrimed.class'
    exclude 'btw/modern/EntityThrowable.class'
    exclude 'btw/modern/EntityWeatherEffect.class'
    exclude 'btw/modern/EntityXPOrb.class'
    // FCEntityLightningBolt: no frozen copy since the 2026-10-10 regeneration (the
    // live class is net.minecraft.src.btw.entity.FCEntityLightningBolt). Modern-Common's
    // copy is a dead stub nothing links to, kept out of the jar (and the dev view).
    exclude 'btw/modern/FCEntityLightningBolt.class'
    // Reconciled with the former dev-only list (removeModernCommonShadowedClasses): these collide
    // and the FC version is authoritative, but were previously only deleted
    // in dev — so the Modern-Common stub shipped in the jar and shadowed FC
    // in PROD ONLY. The projectile entities, RandomPositionGenerator (AI), and
    // EntityLookHelper (whose Modern-Common version is an empty stub while FC's
    // EntityLiving calls new EntityLookHelper(this)). ChunkCache left this list:
    // the frozen copy is no longer merged and Modern-Common's port ships.
    exclude 'btw/modern/EntityEgg.class'
    exclude 'btw/modern/EntityLargeFireball.class'
    exclude 'btw/modern/EntityWitherSkull.class'
    exclude 'btw/modern/RandomPositionGenerator.class'
    exclude 'btw/modern/EntityLookHelper.class'
    // Model rendering: real 1.5.2 classes replace stubs for correct UVs
    // (a self-contained cluster: ModelRenderer, single-sourced, uses the 10-arg ModelBox ctor both copies share)
    exclude 'btw/modern/ModelBox.class'
    exclude 'btw/modern/TexturedQuad.class'
    exclude 'btw/modern/PositionTextureVertex.class'
}

// FCMOD-INTEGRATION(1.20.1): dev-run: the dev view of Modern-Common (sourceSets.devModernCommon), the declared
// output of exactly one task. It replaces removeModernCommonShadowedClasses, which deleted the listed stubs from
// Modern-Common's own build output: an undeclared write into :Modern-Common:compileJava's output dir. A build that
// noticed it re-ran that compile non-incrementally and rewrote the whole dir under a live server (NoClassDefFoundError
// btw/modern/DataWatcher, a class never listed); a build that missed it, or a -x list that skipped the compile, left
// :Forge:compileJava and :Modern-Common:jar reading the stripped dir ("cannot access btw.modern.EntityLiving").
// Nothing in this project writes Modern-Common's output now. The sentinel is the dev half of the jar's
// class-precedence guard (after the jar { } block).
def devModernCommonDir = sourceSets.devModernCommon.output.classesDirs.files.first()
task syncDevModernCommon(type: Sync) {
    description = 'Copies Modern-Common output minus the shadow list (modernCommonRuntime) into the dev view'
    with modernCommonRuntime
    into devModernCommonDir
    doLast {
        boolean chestPresent = new File(devModernCommonDir, 'btw/modern/ContainerChest.class').isFile()
        boolean entityPresent = new File(devModernCommonDir, 'btw/modern/Entity.class').exists()
        if (!chestPresent || entityPresent) {
            throw new GradleException("Dev class precedence drifted in ${devModernCommonDir}: ContainerChest.class " +
                "${chestPresent ? 'present' : 'MISSING'}, Entity.class ${entityPresent ? 'PRESENT' : 'absent'}. The dev " +
                "view must be Modern-Common minus the shadow list (modernCommonRuntime), exactly as the jar binds it.")
        }
        logger.lifecycle("Dev class precedence OK (ContainerChest = Modern-Common, Entity = fc)")
    }
}
// ForgeGradle makes every run task and prepareRun*Compile depend on the classes task of each mods{} source
// (RunConfigGenerator.java:223-230), so this puts the sync in front of every dev run; the prepareRun*/run*
// wiring after the ASM passes also covers prepareRun*, which IntelliJ runs before launch.
tasks.named(sourceSets.devModernCommon.classesTaskName).configure {
    dependsOn syncDevModernCommon
}

// FCMOD-INTEGRATION(1.20.1): dev-run: mods{} order guard, the configuration-time half of the dev class-precedence
// check. Every run must list sourceSets.fc and, after it, sourceSets.devModernCommon (reverse search order: the
// later source wins), and never Modern-Common's own main output, which holds every stub and would beat fc on the
// shadow-listed classes too.
afterEvaluate {
    def modernCommonMain = project(':Modern-Common').sourceSets.main
    minecraft.runs.each { runConfig ->
        List modSources = runConfig.mods.collectMany { it.sources }
        int fcIndex = modSources.indexOf(sourceSets.fc)
        int devIndex = modSources.indexOf(sourceSets.devModernCommon)
        if (modSources.contains(modernCommonMain) || fcIndex < 0 || devIndex < fcIndex) {
            throw new GradleException("Dev class precedence: run '${runConfig.name}' lists mod sources " +
                "${modSources*.name}. It must list sourceSets.fc, then sourceSets.devModernCommon, and never " +
                "project(':Modern-Common').sourceSets.main (see the server run's mods{} comment).")
        }
    }
}

// ------------------------------------------------------------------
// ASM bytecode patch: open up access on FC's vanilla 1.5.2 Entity.
//
// FC code is compiled against the btw.api placeholders (Api module, relocated to
// btw.modern by remapFcCode), which declare these members public. The regenerated
// frozen classes declare some of them private/protected (javap: Entity 8 private,
// e.g. fire at vanilla/server Entity.java:163; EntityLiving 26 private + 1 protected;
// PathNavigate 22 private). FC callers live in net.minecraft.src.btw.*, a different
// runtime package, so those accesses hit IllegalAccessError or verifier rejection.
// Even for protected members, when an FC subclass accesses one via bytecode
// `getfield btw/modern/Entity.field` where the stack type
// is `Entity` (not the subclass), the JVM verifier rejects it as
// "Bad access to protected data in getfield" — even when the accessor
// IS technically a subclass, because verifier strict type tracking
// requires the stack top to be the subclass type, not Entity itself.
//
// The fix is to promote all Entity fields and methods to `public` via
// ASM, so the protected-access verifier check doesn't apply. This runs
// inside extractFcClasses, after its Sync and the other three passes, so it
// operates on the remapped btw/modern/Entity.class (wiring after
// extendFcTreeBuildRange below).
// ------------------------------------------------------------------
def openUpEntityAccess = {
        ['Entity.class', 'EntityLiving.class', 'EntityCreature.class', 'EntityMob.class',
         'EntityAgeable.class', 'EntityAnimal.class',
         // Concrete mob/animal classes — see remapFcCode for the rationale
         // (vanilla 1.5.2 EntityAgeable's m_fAdultWidth=-1 sentinel must be
         // overwritten by setSize from the subclass constructor).
         'EntityPig.class', 'EntityCow.class', 'EntitySheep.class',
         'EntityChicken.class', 'EntityWolf.class', 'EntityOcelot.class',
         'EntityMooshroom.class', 'EntityVillager.class',
         'EntityZombie.class', 'EntitySkeleton.class', 'EntityCreeper.class',
         'EntityEnderman.class', 'EntitySpider.class', 'EntityCaveSpider.class',
         'EntityWitch.class', 'EntityPigZombie.class', 'EntityWither.class',
         'EntitySlime.class', 'EntityMagmaCube.class', 'EntityGhast.class',
         'EntityBlaze.class', 'EntitySilverfish.class',
         'EntityBat.class', 'EntitySquid.class',
         'EntitySnowman.class', 'EntityIronGolem.class',
         'EntityAmbientCreature.class', 'EntityWaterMob.class',
         'EntityGolem.class', 'EntityFlying.class', 'EntityTameable.class',
         'EntityArrow.class', 'EntityBoat.class', 'EntityFX.class', 'EntityFallingSand.class',
         'EntityFireball.class', 'EntityFishHook.class', 'EntityItem.class', 'EntityMinecart.class',
         'EntityPainting.class', 'EntityTNTPrimed.class', 'EntityThrowable.class',
         'EntityWeatherEffect.class', 'EntityXPOrb.class', 'FCEntityLightningBolt.class',
         // AI task base classes — FC subclasses (FCEntityAI*) in
         // net.minecraft.src.btw.entity access protected fields on these
         // parent classes (remapped to btw.modern.*). Without promotion,
         // the module system throws IllegalAccessError every tick.
         'EntityAIAttackOnCollide.class', 'EntityAITarget.class',
         'EntityAINearestAttackableTarget.class', 'EntityAIHurtByTarget.class',
         'EntityAIMoveTwardsRestriction.class', 'EntityAIMoveThroughVillage.class',
         'EntityAIWatchClosest.class', 'EntityAILookIdle.class',
         'EntityAISwimming.class', 'EntityAIMate.class',
         'EntityAIFollowParent.class', 'EntityAIWander.class',
         'EntityAIControlledByPlayer.class',
         // Navigation / helper classes accessed cross-package by FC code
         'PathNavigate.class', 'EntityLookHelper.class', 'EntityMoveHelper.class',
         'EntityJumpHelper.class', 'EntityBodyHelper.class',
         'PathFinder.class',
         'CombatTracker.class', 'CombatEntry.class'].each { fileName ->
            def classFile = file("${buildDir}/classes/java/fc/btw/modern/${fileName}")
            if (!classFile.exists()) {
                logger.warn("openUpEntityAccess: ${classFile} not found — skipping")
                return
            }
            byte[] input = classFile.bytes
            ClassReader reader = new ClassReader(input)
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                FieldVisitor visitField(int access, String name, String desc, String sig, Object value) {
                    int newAccess = (access & ~(Opcodes.ACC_PROTECTED | Opcodes.ACC_PRIVATE)) | Opcodes.ACC_PUBLIC
                    return super.visitField(newAccess, name, desc, sig, value)
                }
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    int newAccess = access
                    if (!name.equals("<init>") && !name.equals("<clinit>")) {
                        newAccess = (access & ~(Opcodes.ACC_PROTECTED | Opcodes.ACC_PRIVATE)) | Opcodes.ACC_PUBLIC
                    }
                    return super.visitMethod(newAccess, name, desc, sig, exceptions)
                }
            }, 0)
            classFile.bytes = writer.toByteArray()
            logger.lifecycle("Patched ${classFile.name}: all fields/methods promoted to public")
        }
}

// ------------------------------------------------------------------
// ASM bytecode patch #2: widen pre-restructure FC hook descriptors.
//
// NOTE (2026-10-10): since the frozen artifact was regenerated from vanilla/ it
// references net.minecraft.src.btw.** directly and already declares the wide
// hooks (fc Entity has OnKickedByCow(btw.modern.Entity) etc., vanilla/server
// Entity.java:2351/2355/2374/2473), so passes (a) and (b) below are no-ops, kept
// pending cleanup. Pass (c) is LIVE: it widens the narrow overrides that the
// shipped Client FC variants still declare (see its comment).
//
// The frozen 1.5.2 artifact predates the hook-widening now present in
// vanilla/ — it declares Entity.OnKickedByCow(FCEntityCow),
// OnFlungBySquidTentacle(FCEntitySquid), OnStruckByLightning(FCEntity-
// LightningBolt) and OnHeadCrabbedBySquid(FCEntitySquid) with narrow
// FC-subclass params. Live restructured FC callers (FCEntityCow.java:551,
// FCEntitySquid.java:884/1278, FCEntityLightningBolt.java:100) compile
// against the widened Api hooks and emit (Lbtw/modern/Entity;)V — a
// descriptor that does not exist on the frozen classes: NoSuchMethodError
// the first time a cow kick or squid attack connects.
//
// Fix: widen the frozen declarations on the loaded base hierarchy
// (Entity, EntityLiving, EntityAnimal) and rewrite the narrow call sites
// (FCEntityLightningBolt.onUpdate is the only one). Bytecode-verified
// safe: every body uses the param only as Entity — except EntityAnimal,
// which passes it to DamageSource.causeMobDamage(EntityLiving), so a
// CHECKCAST EntityLiving is injected after each param load there (all
// real callers pass EntityLiving subclasses, the cast always succeeds).
// StackMapTable check: only Entity.OnStruckByLightning has frames, all
// 'same'-type (no local types recorded), so ClassWriter(0) is safe.
// The pre-regeneration FLAT FCEntityCreeper/Pig/Zombie copies kept narrow
// overrides (dead code). The LIVE net.minecraft.src.btw.entity Client
// variants have the same narrow overrides; pass (c) widens those.
// ------------------------------------------------------------------
def widenFcHookDescriptors = {
        def hookNames = ['OnKickedByCow', 'OnFlungBySquidTentacle',
                         'OnStruckByLightning', 'OnHeadCrabbedBySquid'] as Set
        def narrowDesc = ~/\(Lbtw\/modern\/FCEntity[^;]*;\)V/
        def wideDesc = '(Lbtw/modern/Entity;)V'

        // (a) widen declarations; EntityAnimal additionally gets checkcasts
        ['Entity.class', 'EntityLiving.class', 'EntityAnimal.class'].each { fileName ->
            def classFile = file("${buildDir}/classes/java/fc/btw/modern/${fileName}")
            if (!classFile.exists()) {
                logger.warn("widenFcHookDescriptors: ${classFile} not found — skipping")
                return
            }
            boolean needsCast = fileName == 'EntityAnimal.class'
            ClassReader reader = new ClassReader(classFile.bytes)
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    if (hookNames.contains(name) && desc ==~ narrowDesc) {
                        logger.lifecycle("Widened ${fileName} ${name}${desc} -> ${wideDesc}")
                        MethodVisitor mv = super.visitMethod(access, name, wideDesc, sig, exceptions)
                        if (!needsCast) {
                            return mv
                        }
                        return new MethodVisitor(Opcodes.ASM9, mv) {
                            @Override
                            void visitVarInsn(int opcode, int varIdx) {
                                super.visitVarInsn(opcode, varIdx)
                                if (opcode == Opcodes.ALOAD && varIdx == 1) {
                                    super.visitTypeInsn(Opcodes.CHECKCAST, 'btw/modern/EntityLiving')
                                }
                            }
                        }
                    }
                    return super.visitMethod(access, name, desc, sig, exceptions)
                }
            }, 0)
            classFile.bytes = writer.toByteArray()
        }

        // (c) LIVE (runs before (b), which also rewrites any call site still naming a
        // descriptor widened here): widen narrow hook OVERRIDES in FC entity subclasses.
        // remapFcCode keeps the Client copy of every Client/Server duplicate (see its
        // from(...) comment), and three Client copies still declare the 4.B overloads
        //   FCEntityCreeper.OnKickedByCow(FCEntityCow), .OnStruckByLightning(FCEntityLightningBolt)
        //     (Client FCEntityCreeper.java:188-210)
        //   FCEntityPig.OnStruckByLightning(FCEntityLightningBolt) (Client FCEntityPig.java:179)
        //   FCEntityZombie.OnHeadCrabbedBySquid(FCEntitySquid) (Client FCEntityZombie.java:325)
        // while every caller invokes the wide btw/modern/Entity hook (Client FCEntityCow.java:552,
        // FCEntityLightningBolt.java:101, Common FCEntitySquid.java:884). So they never
        // dispatch: a cow-kicked creeper never becomes determined to explode, lightning
        // damages creepers instead of charging them and never turns pigs into pigmen. In 4.B
        // the base hook took the FC type, so these WERE overrides; the Server copies carry
        // the widened @Override (Entity) form (Server FCEntityCreeper.java:188/205).
        // Fix: give such a method the wide descriptor and prepend
        //     aload_1; checkcast <narrow>; astore_1
        // so the body keeps its declared parameter type. Every caller passes `this` of the
        // narrow type, so the cast cannot fail. Frames: the class is read with EXPAND_FRAMES,
        // so each original frame comes back in full form with local 1 still typed as the
        // narrow class (true once the prologue ran) and ClassWriter(0) re-compresses it
        // against the new descriptor; the prologue has no branch target and needs one
        // stack slot. Only methods whose owner AND parameter type are btw/modern/Entity
        // subclasses within the fc output are touched; a class that already declares the
        // wide form, or several narrow overloads of one hook, is left alone (WARN).
        def fcRoot = file("${buildDir}/classes/java/fc")
        def singleRefParam = ~/\(L([^;]+);\)V/
        Map<String, String> superOf = [:]
        fileTree(dir: fcRoot, include: '**/*.class').each { f ->
            ClassReader r = new ClassReader(f.bytes)
            superOf[r.className] = r.superName
        }
        def isFcEntity = { String type ->
            Set<String> seen = [] as Set
            for (String c = type; c != null && seen.add(c); c = superOf[c]) {
                if (c == 'btw/modern/Entity') {
                    return true
                }
            }
            return false
        }
        Set<String> widenedOverrides = [] as Set // name + narrow desc, consumed by (b)
        fileTree(dir: fcRoot, include: '**/*.class').each { f ->
            ClassReader reader = new ClassReader(f.bytes)
            String owner = reader.className
            if (owner == 'btw/modern/Entity' || !isFcEntity(owner)) {
                return
            }
            List<Map> hooks = []
            reader.accept(new ClassVisitor(Opcodes.ASM9) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    if (hookNames.contains(name)) {
                        hooks << [name: name, desc: desc, access: access]
                    }
                    return null
                }
            }, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
            Map<String, String> toWiden = [:] // name + narrow desc -> narrow param type
            hooks.each { h ->
                java.util.regex.Matcher pm = singleRefParam.matcher(h.desc)
                if (h.desc == wideDesc || !pm.matches()) {
                    return
                }
                String narrowType = pm.group(1)
                boolean wideDeclared = hooks.any { it.name == h.name && it.desc == wideDesc }
                int overloads = hooks.count { it.name == h.name && it.desc != wideDesc && it.desc ==~ singleRefParam }
                if ((h.access & Opcodes.ACC_STATIC) != 0 || !isFcEntity(narrowType) || wideDeclared || overloads > 1) {
                    logger.warn("widenFcHookDescriptors: left ${owner}.${h.name}${h.desc} narrow " +
                        "(static=${(h.access & Opcodes.ACC_STATIC) != 0}, param is Entity subclass=${isFcEntity(narrowType)}, " +
                        "wide form declared=${wideDeclared}, narrow overloads=${overloads})")
                    return
                }
                toWiden[h.name + h.desc] = narrowType
            }
            if (toWiden.isEmpty()) {
                return
            }
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    String narrowType = toWiden[name + desc]
                    if (narrowType == null) {
                        return super.visitMethod(access, name, desc, sig, exceptions)
                    }
                    MethodVisitor mv = super.visitMethod(access, name, wideDesc, null, exceptions)
                    return new MethodVisitor(Opcodes.ASM9, mv) {
                        @Override
                        void visitCode() {
                            super.visitCode()
                            super.visitVarInsn(Opcodes.ALOAD, 1)
                            super.visitTypeInsn(Opcodes.CHECKCAST, narrowType)
                            super.visitVarInsn(Opcodes.ASTORE, 1)
                        }
                        @Override
                        void visitMaxs(int maxStack, int maxLocals) {
                            super.visitMaxs(Math.max(maxStack, 1), maxLocals)
                        }
                    }
                }
            }, ClassReader.EXPAND_FRAMES)
            f.bytes = writer.toByteArray()
            toWiden.each { String key, String narrowType ->
                widenedOverrides << key
                logger.lifecycle("widenFcHookDescriptors: widened ${owner}.${key} -> ${wideDesc} " +
                    "(entry checkcast ${narrowType})")
            }
        }

        // (b) rewrite narrow call sites anywhere in the fc output
        fileTree(dir: "${buildDir}/classes/java/fc", include: '**/*.class').each { f ->
            boolean[] changed = [false]
            ClassReader reader = new ClassReader(f.bytes)
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    return new MethodVisitor(Opcodes.ASM9, super.visitMethod(access, name, desc, sig, exceptions)) {
                        @Override
                        void visitMethodInsn(int opcode, String owner, String mName, String mDesc, boolean isInterface) {
                            if (hookNames.contains(mName) && (mDesc ==~ narrowDesc || widenedOverrides.contains(mName + mDesc))) {
                                changed[0] = true
                                super.visitMethodInsn(opcode, owner, mName, wideDesc, isInterface)
                            } else {
                                super.visitMethodInsn(opcode, owner, mName, mDesc, isInterface)
                            }
                        }
                    }
                }
            }, 0)
            if (changed[0]) {
                f.bytes = writer.toByteArray()
                logger.lifecycle("Rewrote narrow FC hook call site(s) in ${f.name}")
            }
        }
}

// ------------------------------------------------------------------
// ASM bytecode patch #3: let the frozen 1.5.2 pathfinder work below y=0.
//
// 1.5.2 worlds span y 0..255; a 1.20.1 level spans minBuildHeight..maxBuildHeight-1
// (overworld -64..319). The frozen pathing/AI classes bake in "y >= 0":
//  (a) PathFinder.getSafePoint drops each candidate point to the ground with
//      `while (par3 > 0) { ...; --par3; if (par3 > 0) var7 = openPoint(...); }`
//      (vanilla/client PathFinder.java:242-266). At y <= 0 the scan never runs, so A*
//      treats air as walkable there (paths off ledges and across pits, no lava check
//      below). Both `iload_3; ifle L` compares become
//        iload_3; aload_1; getfield Entity.worldObj; invokevirtual World.getFcMinBuildHeight()I; if_icmple L
//      i.e. `par3 > entity.worldObj.getFcMinBuildHeight()`. Modern-Common World returns 0
//      (1.5.2 behaviour unchanged); WorldBridge returns the level's min build height.
//  (b) PathNavigate.getPathableYPos returns `(int)(boundingBox.minY + 0.5D)`
//      (vanilla/client PathNavigate.java:350), while PathFinder starts paths at
//      floor_double(minY + 0.5D) (PathFinder.java:492). `(int)` truncates toward zero,
//      so for a mob standing at y=-59 the navigator reports -58 while the path points are
//      at -59. pathFollow's same-y scan (PathNavigate.java:236) then stops at the current
//      index, the index never advances, and the mob stands still until the 100-tick stuck
//      check clears the path: cave mobs below y=0 never chase or wander. Every d2i in
//      PathNavigate (9, all y values: :129, :137, :236, :329, :346, :350, :375, :414, :466)
//      and PathFinder (1, the swimming start y: :497) becomes
//      invokestatic MathHelper.floor_double(D)I, which is identical for y >= 0.
//      EntityAIFleeSun.shouldExecute gets the same rewrite (1, the sky-check y
//      `(int)boundingBox.minY`, vanilla/client EntityAIFleeSun.java:49): below y=0 a mob
//      on farmland/slabs/soul sand would otherwise test the air block above its feet and
//      flee the sun where 1.5.2 would not.
// Stack: (a) needs one more slot (visitMaxs keeps >= 2); (b) is stack-neutral (D -> I
// both ways). No branch targets are added, so the existing StackMapTable frames stay
// valid with ClassWriter(0). Idempotent: an already-patched class is detected and left
// alone. Any other bytecode shape fails the build instead of silently shipping the 1.5.2
// bounds.
// ------------------------------------------------------------------
def extendFcPathingBuildRange = {
        def fcModern = file("${buildDir}/classes/java/fc/btw/modern")
        String minHeightName = 'getFcMinBuildHeight'
        String safePointDesc = '(Lbtw/modern/Entity;IIILbtw/modern/PathPoint;I)Lbtw/modern/PathPoint;'

        // (a) PathFinder.getSafePoint: `par3 > 0` -> `par3 > entity.worldObj.getFcMinBuildHeight()`
        def pathFinderFile = new File(fcModern, 'PathFinder.class')
        if (!pathFinderFile.exists()) {
            logger.warn("extendFcPathingBuildRange: ${pathFinderFile} not found — skipping")
        } else {
            int[] counts = [0, 0] // [compares rewritten now, getFcMinBuildHeight calls already present]
            ClassReader reader = new ClassReader(pathFinderFile.bytes)
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    MethodVisitor mv = super.visitMethod(access, name, desc, sig, exceptions)
                    if (name != 'getSafePoint' || desc != safePointDesc) {
                        return mv
                    }
                    boolean[] afterIload3 = [false] // previous instruction was iload_3 (par3, the candidate y)
                    return new MethodVisitor(Opcodes.ASM9, mv) {
                        @Override
                        void visitVarInsn(int opcode, int varIndex) {
                            super.visitVarInsn(opcode, varIndex)
                            afterIload3[0] = opcode == Opcodes.ILOAD && varIndex == 3
                        }
                        @Override
                        void visitJumpInsn(int opcode, Label label) {
                            if (opcode == Opcodes.IFLE && afterIload3[0]) {
                                super.visitVarInsn(Opcodes.ALOAD, 1)
                                super.visitFieldInsn(Opcodes.GETFIELD, 'btw/modern/Entity', 'worldObj', 'Lbtw/modern/World;')
                                super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, 'btw/modern/World', minHeightName, '()I', false)
                                super.visitJumpInsn(Opcodes.IF_ICMPLE, label)
                                counts[0]++
                            } else {
                                super.visitJumpInsn(opcode, label)
                            }
                            afterIload3[0] = false
                        }
                        @Override
                        void visitMethodInsn(int opcode, String owner, String mName, String mDesc, boolean isInterface) {
                            if (owner == 'btw/modern/World' && mName == minHeightName) {
                                counts[1]++
                            }
                            super.visitMethodInsn(opcode, owner, mName, mDesc, isInterface)
                            afterIload3[0] = false
                        }
                        // Any other instruction or a label between iload_3 and ifle breaks the pattern.
                        @Override
                        void visitInsn(int opcode) {
                            super.visitInsn(opcode)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitIntInsn(int opcode, int operand) {
                            super.visitIntInsn(opcode, operand)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitTypeInsn(int opcode, String type) {
                            super.visitTypeInsn(opcode, type)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitFieldInsn(int opcode, String owner, String fName, String fDesc) {
                            super.visitFieldInsn(opcode, owner, fName, fDesc)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitInvokeDynamicInsn(String iName, String iDesc, Handle bsm, Object... bsmArgs) {
                            super.visitInvokeDynamicInsn(iName, iDesc, bsm, bsmArgs)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitLabel(Label label) {
                            super.visitLabel(label)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitLdcInsn(Object value) {
                            super.visitLdcInsn(value)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitIincInsn(int varIndex, int increment) {
                            super.visitIincInsn(varIndex, increment)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitTableSwitchInsn(int min, int max, Label dflt, Label... labels) {
                            super.visitTableSwitchInsn(min, max, dflt, labels)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitLookupSwitchInsn(Label dflt, int[] keys, Label[] labels) {
                            super.visitLookupSwitchInsn(dflt, keys, labels)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitMultiANewArrayInsn(String aDesc, int numDimensions) {
                            super.visitMultiANewArrayInsn(aDesc, numDimensions)
                            afterIload3[0] = false
                        }
                        @Override
                        void visitMaxs(int maxStack, int maxLocals) {
                            super.visitMaxs(Math.max(maxStack, 2), maxLocals)
                        }
                    }
                }
            }, 0)
            if (counts[0] == 2) {
                pathFinderFile.bytes = writer.toByteArray()
                logger.lifecycle("extendFcPathingBuildRange: PathFinder.getSafePoint drop scan now bounded by World.${minHeightName}()")
            } else if (counts[0] == 0 && counts[1] == 2) {
                logger.lifecycle("extendFcPathingBuildRange: PathFinder.getSafePoint already patched")
            } else {
                throw new GradleException("extendFcPathingBuildRange: unexpected PathFinder.getSafePoint bytecode " +
                    "(${counts[0]} `iload_3; ifle` compares, ${counts[1]} ${minHeightName} calls; expected 2 and 0, " +
                    "or 0 and 2 if already patched). Re-check vanilla/client PathFinder.java:242-266 against javap.")
            }
        }

        // (b) truncating y casts -> MathHelper.floor_double, counts verified against javap of the frozen classes
        [['PathNavigate.class', 9], ['PathFinder.class', 1], ['EntityAIFleeSun.class', 1]].each { entry ->
            String fileName = entry[0]
            int expected = entry[1]
            def classFile = new File(fcModern, fileName)
            if (!classFile.exists()) {
                logger.warn("extendFcPathingBuildRange: ${classFile} not found — skipping")
                return
            }
            int[] replaced = [0]
            ClassReader reader = new ClassReader(classFile.bytes)
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    return new MethodVisitor(Opcodes.ASM9, super.visitMethod(access, name, desc, sig, exceptions)) {
                        @Override
                        void visitInsn(int opcode) {
                            if (opcode == Opcodes.D2I) {
                                replaced[0]++
                                super.visitMethodInsn(Opcodes.INVOKESTATIC, 'btw/modern/MathHelper', 'floor_double', '(D)I', false)
                            } else {
                                super.visitInsn(opcode)
                            }
                        }
                    }
                }
            }, 0)
            if (replaced[0] == expected) {
                classFile.bytes = writer.toByteArray()
                logger.lifecycle("extendFcPathingBuildRange: ${fileName} ${expected} truncating y cast(s) -> MathHelper.floor_double")
            } else if (replaced[0] == 0) {
                logger.lifecycle("extendFcPathingBuildRange: ${fileName} already patched (no d2i left)")
            } else {
                throw new GradleException("extendFcPathingBuildRange: ${fileName} has ${replaced[0]} d2i, expected " +
                    "${expected} (all y casts, see the comment above). Re-check the frozen class against javap.")
            }
        }
}

// ------------------------------------------------------------------
// FC tree generators: 1.5.2 build range -> the level's build range.
// FCBlockSapling.growTree reaches FCUtilsTrees.GenerateTaiga2 / GenerateForest / GenerateTrees
// and FCUtilsGenHugeTree.generate, which test the base and the clearance scan against the
// 1.5.2 world (`j >= 1` = the block below the sapling is in the world, scan `y >= 0`, top 256;
// Common FCUtilsTrees.java:187-229, 317, 340; Server FCUtilsGenHugeTree.java:46, 69). Below
// y=1 (superflat, deepslate caves) every growth attempt failed and restored the sapling at
// stage 3. Same contract as extendFcPathingBuildRange (World.getFcMinBuildHeight /
// getFcMaxBuildHeight: 0 / 256 in Modern-Common, the level's range from WorldBridge):
//   (a) base:  `iload j; iconst_1; if_icmplt L` -> `iload j; iconst_1; isub; aload world;
//              invokevirtual getFcMinBuildHeight; if_icmplt L`   (j - 1 < min  <=>  j < min + 1)
//   (b) scan:  `iflt L` -> `aload world; invokevirtual getFcMinBuildHeight; if_icmplt L`
//   (c) tops:  `sipush 256` -> `aload world; invokevirtual getFcMaxBuildHeight`
// GenerateForest / GenerateTaiga2 test against FC's own 128, not the 1.5.2 world top: that
// is a 4.B rule measured from sea level (63 in both versions) and stays as it is.
// No branch targets are added and the stack at every branch target is unchanged, so the
// existing frames stay valid with ClassWriter(0); max stack grows by at most 1. Idempotent
// (an already-patched method is detected); any other bytecode shape fails the build.
// ------------------------------------------------------------------
def extendFcTreeBuildRange = {
        def fcUtil = file("${buildDir}/classes/java/fc/net/minecraft/src/btw/util")
        String gen5 = '(Lbtw/modern/World;Ljava/util/Random;III)Z'
        // class -> [method, desc, world slot, j slot, expected 256 tops]
        def targets = [
            'FCUtilsTrees.class'      : [['GenerateTaiga2', gen5, 0, 3, 0],
                                         ['GenerateForest', gen5, 0, 3, 0],
                                         ['GenerateTrees', '(Lbtw/modern/World;Ljava/util/Random;IIIIIIZ)Z', 0, 3, 3]],
            'FCUtilsGenHugeTree.class': [['generate', gen5, 1, 4, 3]],
        ]
        targets.each { String fileName, List methods ->
            def classFile = new File(fcUtil, fileName)
            if (!classFile.exists()) {
                logger.warn("extendFcTreeBuildRange: ${classFile} not found — skipping")
                return
            }
            def counts = [:] // method -> [base, scan, tops, already-present min calls]
            ClassReader reader = new ClassReader(classFile.bytes)
            ClassWriter writer = new ClassWriter(0)
            reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                @Override
                MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
                    MethodVisitor mv = super.visitMethod(access, name, desc, sig, exceptions)
                    def target = methods.find { it[0] == name && it[1] == desc }
                    if (target == null) {
                        return mv
                    }
                    int worldSlot = target[2]
                    int jSlot = target[3]
                    int[] c = [0, 0, 0, 0]
                    counts[name] = c
                    int[] state = [0] // 1 = after `iload j`, 2 = after `iload j; iconst_1`
                    return new MethodVisitor(Opcodes.ASM9, mv) {
                        void loadMin() {
                            super.visitVarInsn(Opcodes.ALOAD, worldSlot)
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, 'btw/modern/World', 'getFcMinBuildHeight', '()I', false)
                        }
                        @Override
                        void visitVarInsn(int opcode, int varIndex) {
                            super.visitVarInsn(opcode, varIndex)
                            state[0] = (opcode == Opcodes.ILOAD && varIndex == jSlot) ? 1 : 0
                        }
                        @Override
                        void visitInsn(int opcode) {
                            super.visitInsn(opcode)
                            state[0] = (opcode == Opcodes.ICONST_1 && state[0] == 1) ? 2 : 0
                        }
                        @Override
                        void visitJumpInsn(int opcode, Label label) {
                            if (opcode == Opcodes.IF_ICMPLT && state[0] == 2) {
                                super.visitInsn(Opcodes.ISUB)
                                loadMin()
                                super.visitJumpInsn(Opcodes.IF_ICMPLT, label)
                                c[0]++
                            } else if (opcode == Opcodes.IFLT) {
                                loadMin()
                                super.visitJumpInsn(Opcodes.IF_ICMPLT, label)
                                c[1]++
                            } else {
                                super.visitJumpInsn(opcode, label)
                            }
                            state[0] = 0
                        }
                        @Override
                        void visitIntInsn(int opcode, int operand) {
                            if (opcode == Opcodes.SIPUSH && operand == 256) {
                                super.visitVarInsn(Opcodes.ALOAD, worldSlot)
                                super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, 'btw/modern/World', 'getFcMaxBuildHeight', '()I', false)
                                c[2]++
                            } else {
                                super.visitIntInsn(opcode, operand)
                            }
                            state[0] = 0
                        }
                        @Override
                        void visitMethodInsn(int opcode, String owner, String mName, String mDesc, boolean isInterface) {
                            if (owner == 'btw/modern/World' && mName == 'getFcMinBuildHeight') {
                                c[3]++
                            }
                            super.visitMethodInsn(opcode, owner, mName, mDesc, isInterface)
                            state[0] = 0
                        }
                        @Override
                        void visitFieldInsn(int opcode, String owner, String fName, String fDesc) {
                            super.visitFieldInsn(opcode, owner, fName, fDesc)
                            state[0] = 0
                        }
                        @Override
                        void visitTypeInsn(int opcode, String type) {
                            super.visitTypeInsn(opcode, type)
                            state[0] = 0
                        }
                        @Override
                        void visitIincInsn(int varIndex, int increment) {
                            super.visitIincInsn(varIndex, increment)
                            state[0] = 0
                        }
                        @Override
                        void visitLdcInsn(Object value) {
                            super.visitLdcInsn(value)
                            state[0] = 0
                        }
                        @Override
                        void visitLabel(Label label) {
                            super.visitLabel(label)
                            state[0] = 0
                        }
                        @Override
                        void visitMaxs(int maxStack, int maxLocals) {
                            super.visitMaxs(maxStack + 1, maxLocals)
                        }
                    }
                }
            }, 0)
            boolean changed = false
            methods.each { m ->
                int[] c = counts[m[0]]
                if (c == null) {
                    throw new GradleException("extendFcTreeBuildRange: ${fileName} has no ${m[0]}${m[1]}")
                }
                if (c[0] == 1 && c[1] == 1 && c[2] == m[4]) {
                    changed = true
                    logger.lifecycle("extendFcTreeBuildRange: ${fileName} ${m[0]} base, scan floor and ${m[4]} top(s) now use the level's build range")
                } else if (c[0] == 0 && c[1] == 0 && c[2] == 0 && c[3] >= 2) {
                    logger.lifecycle("extendFcTreeBuildRange: ${fileName} ${m[0]} already patched")
                } else {
                    throw new GradleException("extendFcTreeBuildRange: unexpected ${fileName} ${m[0]} bytecode " +
                        "(base ${c[0]}/1, scan ${c[1]}/1, tops ${c[2]}/${m[4]}). Re-check the FC class against javap.")
                }
            }
            if (changed) {
                classFile.bytes = writer.toByteArray()
            }
        }
}

// FCMOD-INTEGRATION(1.20.1): dev-run: build/classes/java/fc has exactly one writer, extractFcClasses. The four ASM
// passes above (closures that keep their former task names) run as its actions, after the Sync, in the order the
// former tasks executed: widen, pathing, tree, then openUp (whose dependsOn chain made it last). Gradle records
// a task's outputs after all of its actions, so the patched bytes are the recorded state, and a build with
// unchanged inputs leaves the dir UP-TO-DATE and untouched while a dev run has it loaded. As separate tasks with
// no declared outputs they patched a dir another task owned, on every build (openUpEntityAccess rewrote 71 loaded
// classes each time). No other task may write build/classes/java/fc: add a new pass here, as another doLast.
// Every consumer already depends on extractFcClasses (prepareRun*, run* and classes next to that task; the jar's
// own dependsOn).
extractFcClasses.doLast { widenFcHookDescriptors() }
extractFcClasses.doLast { extendFcPathingBuildRange() }
extractFcClasses.doLast { extendFcTreeBuildRange() }
extractFcClasses.doLast { openUpEntityAccess() }

// FCMOD-INTEGRATION(1.20.1): dev-run: every dev run loads the dev view of Modern-Common. The classes-task
// dependsOn next to syncDevModernCommon covers the run and prepareRun*Compile tasks; this also covers
// prepareRun*, which IntelliJ runs before launch without the classes tasks (IntellijRunGenerator.java:176-179).
// syncDevModernCommon writes only its own dir, never Modern-Common's output, so unlike the old
// removeModernCommonShadowedClasses it is safe on any task.
tasks.matching { it.name.startsWith('prepareRun') || it.name.startsWith('run') }.configureEach {
    dependsOn syncDevModernCommon
}

// ------------------------------------------------------------------
// Bundle dependent modules into the distributable jar.
//
// In dev (runClient/runServer) the Modern-Common, Api, and remapped FC
// classes are injected into the mod container via the `mods { source
// sourceSets... }` block. A standalone jar dropped into a player's
// mods/ folder does not get that treatment, so we must copy those class
// trees INTO the jar at build time.
// ------------------------------------------------------------------
jar {
    dependsOn ':Api:jar', ':Modern-Common:jar', extractFcClasses

    // Populate JAR manifest with version info. Forge's mods.toml
    // placeholder ${file.jarVersion} reads Implementation-Version.
    manifest {
        attributes([
            'Specification-Title'     : project.portArchiveName,
            'Specification-Vendor'    : 'Better Than Wolves Port',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.portArchiveName,
            'Implementation-Version'  : project.portVersion,
            'Implementation-Vendor'   : 'Better Than Wolves Port',
            'Implementation-Timestamp': new Date().format('yyyy-MM-dd\'T\'HH:mm:ssZ'),
            'BTW-Upstream-Version'    : project.btwVersion,
            'BTW-Upstream-MC-Version' : project.mcVersion,
            'BTW-Target-MC-Version'   : project.portMcVersion,
            'MixinConfigs'            : 'betterthanwolves.mixins.json',
        ])
    }

    // ---- Class precedence (MUST match dev runs) --------------------------
    // DuplicatesStrategy.EXCLUDE keeps the FIRST copy Gradle visits. Gradle 8.9
    // walks a spec's OWN sources (`from x`) before its CHILD specs
    // (`from(x) { ... }` and `with spec`, both appended by addChildSpec), and children
    // in declaration order (DefaultCopySpec$DefaultCopySpecResolver.walk). Walk order:
    //   1. Forge main output (own source from the java plugin; btw/forge + resources)
    //   2. modernCommonRuntime child (Modern-Common minus the shadow list)
    //   3. fc child (frozen 1.5.2 + relocated FC classes)
    //   4. Api child (btw/api/** excluded -> contributes nothing)
    // So for every btw.modern collision Modern-Common wins UNLESS the class is on
    // the shadow list (modernCommonRuntime's excludes). Then only the frozen fc copy
    // exists. Dev runs use the same rule: securejarhandler searches mods{} sources in
    // reverse declaration order, and their last source, devModernCommon, is
    // syncDevModernCommon's copy of this same copySpec, so the two cannot drift
    // (tools/LinkAudit.java checks the dev copy and the jar).
    with modernCommonRuntime

    // FC classes: a CHILD spec declared AFTER Modern-Common, so it loses every
    // collision the shadow list does not hand to it. NEVER collapse this to
    // `from sourceSets.fc.output`. That form is an OWN source, visited before the
    // Modern-Common child, and it made fc win all 16 non-listed collisions in the
    // jar only (frozen ContainerChest/Repair/Enchantment/..., IEntitySelector,
    // EntityAIBase, ...; STUB_CATALOGUE 2026-10-10). The guard below fails the
    // build if this flips.
    from(sourceSets.fc.output) {
        // remapFcCode's manifest rides along in the extracted dir; Jar's
        // ExcludeManifestAction already drops it. Explicit for clarity.
        exclude 'META-INF/MANIFEST.MF'
    }

    // Api module — just the FC-facing btw.api.* interfaces. These are
    // already shadow-relocated out of the FC bytecode, but some compiled
    // Forge-side code may still reference them at class-load time.
    from(project(':Api').sourceSets.main.output) {
        exclude 'btw/api/**' // same reason — Modern-Common is authoritative
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The dist jar must contain the data-gen output — the loot/recipe rebalance
// (INTEGRATIONS #004/#005) lives in src/generated/resources, which is
// committed to git. Fail loudly if it's missing so a wiped tree can't
// silently ship a jar without the overrides. (Guard is on `jar`, not
// processResources, so runData itself can regenerate from an empty dir.)
tasks.named('jar').configure {
    doFirst {
        def genData = file('src/generated/resources/data')
        if (!genData.isDirectory() || (genData.list()?.length ?: 0) == 0) {
            throw new GradleException('Forge/src/generated/resources is missing or empty — ' +
                'the loot/recipe overrides (#004/#005) would not ship. Run: gradlew :Forge:runData')
        }
    }
}

// Class-precedence guard: the dist jar must bind btw.modern collisions exactly as
// dev runs do. Sentinels:
//  - ContainerChest: collides and is NOT shadow-listed, so the jar copy must be
//    Modern-Common's. ContainerBridge.SimpleChestContainer adds its own slots; the
//    frozen 1.5.2 ctor adds them too (vanilla/server ContainerChest.java:21-50).
//  - Entity: shadow-listed, so the jar copy must be the frozen fc one.
// If you ever shadow-list ContainerChest, pick another non-listed collision.
// Runs in jar.doLast, before ForgeGradle's reobfJar rewrites the archive; the fc
// Entity.class compared against is already ASM-patched (jar dependsOn extractFcClasses, whose actions include
// the ASM passes). syncDevModernCommon's doLast checks the same two sentinels in the dev view.
def precedenceMcClasses = project(':Modern-Common').sourceSets.main.output.classesDirs.files.first()
def precedenceFcClasses = sourceSets.fc.output.classesDirs.files.first()
tasks.named('jar').configure {
    doLast { jarTask ->
        def jarFile = jarTask.archiveFile.get().asFile
        def expected = [
            'btw/modern/ContainerChest.class': new File(precedenceMcClasses, 'btw/modern/ContainerChest.class'),
            'btw/modern/Entity.class'        : new File(precedenceFcClasses, 'btw/modern/Entity.class'),
        ]
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            expected.each { String path, File src ->
                def entry = zip.getEntry(path)
                byte[] inJar = entry == null ? null : zip.getInputStream(entry).withCloseable { it.bytes }
                if (inJar == null || !src.isFile() || !Arrays.equals(inJar, src.bytes)) {
                    throw new GradleException("Jar class precedence drifted: ${path} in ${jarFile.name} is not the " +
                        "copy from ${src}. Modern-Common must win every btw.modern collision except the shadow " +
                        "list (modernCommonRuntime, shared with syncDevModernCommon), exactly as in dev runs.")
                }
            }
        }
        logger.lifecycle("Jar class precedence OK (ContainerChest = Modern-Common, Entity = fc)")
    }
}

// Bundling guard: the dist jar carries BTW's own classes and nothing else.
// FCMOD-INTEGRATION(1.20.1): mod compat: the optional mods below are compile-time APIs and dev runtimes only.
// Their licences forbid shipping them inside BTW: Serene Seasons and GlitchCore are All Rights Reserved,
// Pam's HarvestCraft forbids redistribution, Cold Sweat allows library use only, and LSO's licence is unclear.
// An allowlist, not a denylist of known roots: third-party roots are open-ended (maxhyper/ for dtphc2,
// darkorg/ for ss-hc2crops, mezz/ for JEI, and Cold Sweat ships default-package ChangelogGenerator classes).
// Resources under other namespaces stay allowed; they are BTW-authored data (e.g. datagen tags for another
// mod's namespace). Runs after the precedence guard, before reobfJar.
tasks.named('jar').configure {
    doLast { jarTask ->
        def jarFile = jarTask.archiveFile.get().asFile
        def allowedClassRoots = ['btw/', 'net/minecraft/src/']
        List<String> offending = []
        int classes = 0
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            Collections.list(zip.entries()).each { e ->
                String n = e.name
                if (n.endsWith('.class')) {
                    classes++
                    if (!allowedClassRoots.any { n.startsWith(it) }) {
                        offending << n
                    }
                } else if (n.endsWith('.jar') || n.startsWith('META-INF/jarjar/')) {
                    offending << n
                }
            }
        }
        if (offending) {
            throw new GradleException("${jarFile.name} contains ${offending.size()} third-party entr(ies), first: " +
                "${offending.take(10)}. Optional mods are compileOnly/runtimeOnly fg.deobf only; never bundle, " +
                "jarJar or shadow another mod's code (licences, see the bundling guard comment).")
        }
        logger.lifecycle("Jar bundling OK (${classes} classes, all under btw/ or net/minecraft/src/)")
    }
}

// Mixin-config guard: betterthanwolves.mixins.json and the mixin classes in the jar must agree.
// FCMOD-INTEGRATION(1.20.1): mod compat: the config is edited by hand whenever a mixin class lands, and both
// directions of drift fail late or silently. A listed entry with no class crashes at load (defaultRequire 1,
// "required": true); an annotated class nobody lists is never applied, and since Serene Seasons, GlitchCore and
// Cold Sweat mix several of the same targets, the missing BTW behaviour would read as their bug. Fails when:
//  - an entry of mixins/client/server has no class under the config's package;
//  - a class under that package carries @Mixin and is not listed (inner-class mixins list as 'Outer$Inner');
//  - an entry is listed twice;
//  - the manifest MixinConfigs is not exactly betterthanwolves.mixins.json (production loads it from there).
// Non-mixin classes in the package (BTWMixinConnector, anonymous helpers) carry no @Mixin and are ignored.
// @Mixin has CLASS retention, so it is read with ASM (RuntimeInvisibleAnnotations), not reflection.
tasks.named('jar').configure {
    doLast { jarTask ->
        def jarFile = jarTask.archiveFile.get().asFile
        String configName = 'betterthanwolves.mixins.json'
        String mixinDesc = 'Lorg/spongepowered/asm/mixin/Mixin;'
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def configEntry = zip.getEntry(configName)
            if (configEntry == null) {
                throw new GradleException("Mixin config drift: ${configName} is missing from ${jarFile.name}")
            }
            def config = zip.getInputStream(configEntry).withCloseable { new groovy.json.JsonSlurper().parse(it, 'UTF-8') }
            String pkgPath = (config['package'] as String).replace('.', '/') + '/'
            List<String> listed = ['mixins', 'client', 'server'].collectMany { (config[it] ?: []) as List<String> }
            Set<String> listedSet = listed as Set
            List<String> duplicated = listed.countBy { it }.findAll { k, v -> v > 1 }.keySet() as List<String>
            List<String> missing = listedSet.findAll { zip.getEntry(pkgPath + it.replace('.', '/') + '.class') == null } as List<String>
            List<String> unlisted = []
            Collections.list(zip.entries()).each { e ->
                String n = e.name
                if (!n.startsWith(pkgPath) || !n.endsWith('.class')) {
                    return
                }
                List<String> annotations = []
                byte[] bytes = zip.getInputStream(e).withCloseable { it.bytes }
                new ClassReader(bytes).accept(new ClassVisitor(Opcodes.ASM9) {
                    @Override
                    org.objectweb.asm.AnnotationVisitor visitAnnotation(String desc, boolean visible) {
                        annotations << desc
                        return null
                    }
                }, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                String entryName = n.substring(pkgPath.length(), n.length() - '.class'.length()).replace('/', '.')
                if (annotations.contains(mixinDesc) && !listedSet.contains(entryName)) {
                    unlisted << entryName
                }
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            String manifestValue = manifestEntry == null ? null : zip.getInputStream(manifestEntry).withCloseable {
                new java.util.jar.Manifest(it).mainAttributes.getValue('MixinConfigs')
            }
            List<String> manifestConfigs = (manifestValue ?: '').split(',')*.trim().findAll { it }
            List<String> problems = []
            if (missing) {
                problems << "listed but missing from the jar: ${missing.sort()}"
            }
            if (unlisted) {
                problems << "unlisted @Mixin class(es), never applied: ${unlisted.sort()}"
            }
            if (duplicated) {
                problems << "listed more than once: ${duplicated.sort()}"
            }
            if (manifestConfigs != [configName]) {
                problems << "manifest MixinConfigs is '${manifestValue}', expected '${configName}'"
            }
            if (problems) {
                throw new GradleException("Mixin config drift in ${jarFile.name}: ${problems.join('; ')}. Edit " +
                    "src/main/resources/${configName} (case-insensitive alphabetical order) in the same change " +
                    "as the mixin class.")
            }
            logger.lifecycle("Mixin config OK (${listed.size()} entries, all present, no unlisted @Mixin)")
        }
    }
}

repositories {
    // JEI
    maven {
        url 'https://maven.blamejared.com/'
    }
    // FCMOD-INTEGRATION(1.20.1): mod compat: optional-mod APIs and dev runtimes. Plain content filters, NOT
    // exclusiveContent. fg.deobf asks for '<v>_mapped_official_1.20.1' of the SAME group, and only ForgeGradle's
    // bundled_deobf_repo serves that (its filter admits any group with a _mapped_ version). exclusiveContent
    // would give every unlisted repository, the deobf repo included, an excludeGroup for these groups, so the
    // curse.maven and maven.modrinth compileOnly lines below could not resolve. Never wrap fg.repository in
    // exclusiveContent either: that limits the deobf repo to one group and breaks the JEI deobf.
    // maven.minecraftforge.net (Serene Seasons, GlitchCore) already comes from the root build.gradle.
    maven { url 'https://harleyoconnor.com/maven'; content { includeGroup 'com.ferreusveritas.dynamictrees' } }
    maven { url 'https://maven.ryanliptak.com/'; content { includeGroup 'squeek.appleskin' } }
    maven { url 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

// FCMOD-INTEGRATION(1.20.1): mod compat: opt-in dev runtime. -PbtwDevMods=<comma-separated tokens> (or the
// ORG_GRADLE_PROJECT_btwDevMods environment variable) puts those mods, deobfuscated like JEI, on the runtime
// classpath of every run (runServer, runClient, runData). Off by default: without the property the only
// third-party runtime mod is JEI, and nothing here can reach the jar (see the bundling guard). The first
// resolution of a new token set needs network; afterwards --offline works from the Gradle/ForgeGradle caches.
//   gradlew :Forge:runServer -PbtwDevMods=dynamictrees,sereneseasons
//   gradlew :Forge:runClient -PbtwDevMods=appleskin,lso
// /forge mods then prints: dynamictrees 1.20.1-1.4.10 (dynamictrees-latest: 1.20.1-1.4.11), sereneseasons
// 9.1.0.3 + glitchcore 0.0.1.1, appleskin 2.5.1+mc1.20.1, cold_sweat 2.4.3.2, legendarysurvivaloverhaul
// 1.20.1-2.4.7, pamhc2crops 1.0.3, pamhc2trees 1.0.2, pamhc2foodcore 1.0.5, pamhc2foodextended 1.0.1,
// dtphc2 1.20.1-1.3.2, sereneseasonsphc2crops 1.20.1-1.0.0.
// HarvestCraft: Food Extended needs Food Core although its mods.toml does not say so. Food Core 1.0.5 and Food
// Extended 1.0.1 passed only a static SRG check; if they crash, the fallbacks are Food Core 372534:5020789
// (1.0.3) or :4580935 (1.0.0) and Food Extended 402231:4606448 (1.0.0).
def btwDevModCoords = [
    'dynamictrees'       : ['com.ferreusveritas.dynamictrees:DynamicTrees-1.20.1:1.4.10'],
    'dynamictrees-latest': ['maven.modrinth:dynamictrees:1.20.1-1.4.11'],
    'sereneseasons'      : ['com.github.glitchfiend:SereneSeasons-forge:1.20.1-9.1.0.3',
                            'com.github.glitchfiend:GlitchCore-forge:1.20.1-0.0.1.1'],
    'appleskin'          : ['squeek.appleskin:appleskin-forge:mc1.20.1-2.5.1'],
    'coldsweat'          : ['curse.maven:cold-sweat-506194:8907301'],
    'lso'                : ['maven.modrinth:legendary-survival-overhaul:1.20.1-2.4.7'],
    'harvestcraft'       : ['curse.maven:pams-harvestcraft-2-crops-361385:4687624',
                            'curse.maven:pams-harvestcraft-2-trees-365460:4625518',
                            'curse.maven:pams-harvestcraft-2-food-core-372534:5097798',
                            'curse.maven:pams-harvestcraft-2-food-extended-402231:5147171'],
    'dtphc2'             : ['curse.maven:dynamic-trees-pams-harvestcraft-2-839090:7275616'],
    'ss-hc2crops'        : ['curse.maven:serene-seasons-pams-harvestcraft-2-crops-compat-549716:5075306'],
]
// Mandatory dependencies of the addon jars (read from their mods.toml): each inner list is one requirement,
// met by any of its tokens. dtphc2 needs dynamictrees and pamhc2trees; ss-hc2crops needs sereneseasons and
// pamhc2crops.
def btwDevModNeeds = [
    'dtphc2'     : [['dynamictrees', 'dynamictrees-latest'], ['harvestcraft']],
    'ss-hc2crops': [['sereneseasons'], ['harvestcraft']],
]
def btwDevMods = ((findProperty('btwDevMods') ?: '') as String).split(',')*.trim().findAll { it } as Set
String btwDevModValid = "Valid tokens: ${btwDevModCoords.keySet().join(', ')}"
def btwDevModUnknown = btwDevMods - btwDevModCoords.keySet()
if (btwDevModUnknown) {
    throw new GradleException("Unknown -PbtwDevMods token(s) ${btwDevModUnknown}. ${btwDevModValid}")
}
if (btwDevMods.containsAll(['dynamictrees', 'dynamictrees-latest'])) {
    throw new GradleException('dynamictrees and dynamictrees-latest are mutually exclusive (both jars are mod id ' +
        'dynamictrees)')
}
btwDevModNeeds.each { String token, List<List<String>> needs ->
    if (btwDevMods.contains(token)) {
        needs.each { List<String> anyOf ->
            if (!anyOf.any { btwDevMods.contains(it) }) {
                throw new GradleException("-PbtwDevMods=${token} needs ${anyOf.join(' or ')}. ${btwDevModValid}")
            }
        }
    }
}
if (btwDevMods) {
    logger.lifecycle("btwDevMods: ${btwDevMods.join(', ')} on the dev runtime classpath")
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation project(':Modern-Common')
    implementation project(':Api')

    // Mixin annotation processor — generates the refmap at compile time so
    // @Inject(method = "..."), @At(target = "..."), etc. get remapped from
    // MCP (dev) names to SRG names for the distributable jar. Without this
    // the mixin loader fails silently in production.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI — optional runtime dependency. We compile against the API so
    // btw.forge.jei.* can reference JEI types, but the JEI plugin class
    // is only loaded by JEI itself when JEI is installed.
    def jeiVersion = '15.3.0.8'
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jeiVersion}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jeiVersion}")
    // Needed at runtime for the dev client to actually load JEI so we can
    // visually verify the plugin.
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jeiVersion}")

    // FCMOD-INTEGRATION(1.20.1): mod compat: compile-time APIs only, for the optional-mod integrations, whose
    // classes load only when the mod is installed (mods.toml declares each one mandatory=false). Every jar is
    // SRG-named, hence fg.deobf. Never implementation, jarJar or shadow (licences, see the bundling guard).
    // GlitchCore is explicit: the SS POM marks it runtime+optional, but SS's config classes extend
    // glitchcore.config.Config, which javac needs. No HarvestCraft entry: Pam's licence forbids redistribution
    // and decompiling for non-educational use, so BTW names no HarvestCraft type and identifies its content by
    // vanilla block classes, registry ids, tags and JSON only (the harvestcraft dev token just runs the jars).
    compileOnly fg.deobf('com.ferreusveritas.dynamictrees:DynamicTrees-1.20.1:1.4.10')
    compileOnly fg.deobf('com.github.glitchfiend:SereneSeasons-forge:1.20.1-9.1.0.3')
    compileOnly fg.deobf('com.github.glitchfiend:GlitchCore-forge:1.20.1-0.0.1.1')
    compileOnly fg.deobf('squeek.appleskin:appleskin-forge:mc1.20.1-2.5.1:api')
    compileOnly fg.deobf('curse.maven:cold-sweat-506194:8907301')
    compileOnly fg.deobf('maven.modrinth:legendary-survival-overhaul:1.20.1-2.4.7')

    // FCMOD-INTEGRATION(1.20.1): mod compat: the opt-in dev runtime (-PbtwDevMods, validated above). Empty by
    // default, so the JEI runtimeOnly above stays the only third-party runtime mod.
    btwDevMods.each { token -> btwDevModCoords[token].each { runtimeOnly fg.deobf(it) } }
}

// ============================================================
// Copy BTW textures to Forge assets with lowercase filenames.
// MC 1.20.1 rejects resource paths with uppercase characters.
// Source: build/btw-resources/textures/{blocks,items}/
// Dest:   src/main/resources/assets/betterthanwolves/textures/{block,item}/
// ============================================================

task copyBtwTextures {
    description = 'Copies BTW textures to Forge assets, lowercasing all filenames'
    group = 'btw'

    def blockSrc = file("${rootProject.projectDir}/build/btw-resources/textures/blocks")
    def itemSrc  = file("${rootProject.projectDir}/build/btw-resources/textures/items")
    def blockDst = file("src/main/resources/assets/betterthanwolves/textures/block")
    def itemDst  = file("src/main/resources/assets/betterthanwolves/textures/item")

    // Always run — incremental check is inside doLast (timestamp-based)
    outputs.upToDateWhen { false }

    doLast {
        blockDst.mkdirs()
        itemDst.mkdirs()

        def copyLowercase = { File srcDir, File dstDir ->
            int count = 0
            if (srcDir.exists()) {
                srcDir.eachFile { f ->
                    if (f.name.endsWith('.png')) {
                        def lower = f.name.toLowerCase()
                        def dest = new File(dstDir, lower)
                        if (!dest.exists() || f.lastModified() > dest.lastModified()) {
                            dest.bytes = f.bytes
                            count++
                        }
                    }
                }
            }
            return count
        }

        def blocks = copyLowercase(blockSrc, blockDst)
        def items  = copyLowercase(itemSrc, itemDst)
        logger.lifecycle("Copied ${blocks} block textures + ${items} item textures (lowercased)")
    }
}

// Also lowercase all texture references inside model JSONs
task lowercaseModelRefs {
    description = 'Lowercases texture path references in model JSON files'
    group = 'btw'
    dependsOn copyBtwTextures

    def modelsDir = file("src/main/resources/assets/betterthanwolves/models")
    inputs.dir(modelsDir)
    outputs.dir(modelsDir)

    doLast {
        int fixed = 0
        modelsDir.eachFileRecurse { f ->
            if (f.name.endsWith('.json')) {
                def text = f.text
                // Lowercase texture paths: "betterthanwolves:block/SomeName" → "betterthanwolves:block/somename"
                def updated = text.replaceAll('"betterthanwolves:(block|item)/([^"]*)"') { match, type, name ->
                    '"betterthanwolves:' + type + '/' + name.toLowerCase() + '"'
                }
                if (updated != text) {
                    f.text = updated
                    fixed++
                }
            }
        }
        logger.lifecycle("Lowercased texture refs in ${fixed} model JSON files")
    }
}

// ============================================================
// 1.5.2 texture animations -> 1.20.1 .png.mcmeta (audit MPR-4)
// 1.5.2 animated a texture only when <name>.txt sat next to <name>.png: the PNG is cut into square
// frames (frame size = width, frames = height / width; vanilla/client TextureManager.java:89-99) and
// the .txt lists the frame order (TextureStitched.readAnimationInfo, TextureStitched.java:205-245).
// 1.20.1 wants <name>.png.mcmeta instead; without one the whole strip loads as a single squashed
// sprite (SpriteLoader falls back to AnimationMetadataSection.EMPTY: one frame of the full image).
// The .txt and .png are read from the BTW release zip only (read-only); each .mcmeta lands next to
// the lowercased PNG that copyBtwTextures ships.
// 1.5.2 grammar: each trimmed, non-empty line is split on ','; "i*t" shows frame i for t ticks and a
// bare "i" for 1 tick. The first malformed entry ends the list (1.5.2's catch is outside the loop).
// An empty list, or one of 600+ entries, means every frame in order at 1 tick each (updateAnimation's
// fallback), which is an mcmeta without a frame list. 1.20.1 rejects a time below 1 and a negative
// index; 1.5.2 advanced such a frame after one tick, and for an index outside the strip it kept the
// previous frame on screen (it only uploads 0 <= index < frames). The conversion encodes both so.
// ============================================================
task generateBtwTextureAnimations {
    description = "Converts BTW's 1.5.2 texture animations (textures/{blocks,items}/*.txt) to .png.mcmeta"
    group = 'btw'

    def modZip   = file("${rootProject.projectDir}/BTWMod4-B0000003.zip")
    def blockDst = file("src/main/resources/assets/betterthanwolves/textures/block")
    def itemDst  = file("src/main/resources/assets/betterthanwolves/textures/item")

    // Always run: cheap, and each .mcmeta is only rewritten when its content changes
    outputs.upToDateWhen { false }

    doLast {
        if (!modZip.isFile()) {
            logger.warn("BTW mod zip not found at ${modZip} — texture animation .mcmeta files not regenerated")
            return
        }
        def destByPrefix = [
            'MINECRAFT-JAR/textures/blocks/': blockDst,
            'MINECRAFT-JAR/textures/items/' : itemDst
        ]
        int total = 0
        int written = 0
        new java.util.zip.ZipFile(modZip).withCloseable { zip ->
            def entryNames = new TreeSet<String>()
            Collections.list(zip.entries()).each { entryNames << it.name }
            for (String entryName : entryNames) {
                String prefix = destByPrefix.keySet().find { entryName.startsWith(it) }
                if (prefix == null || !entryName.endsWith('.txt')) continue
                String baseName = entryName.substring(prefix.length(), entryName.length() - '.txt'.length())
                String pngName = prefix + baseName + '.png'
                // 1.5.2 reads <name>.txt only for a texture it loads (TextureManager.hasAnimationTxt)
                if (baseName.contains('/') || !entryNames.contains(pngName)) continue

                // Frames as 1.5.2 cuts them: height / width square frames (PNG IHDR width and height)
                byte[] png = zip.getInputStream(zip.getEntry(pngName)).withCloseable { it.bytes }
                int frameCount = -1
                if (png.length >= 24) {
                    int w = ((png[16] & 0xFF) << 24) | ((png[17] & 0xFF) << 16) | ((png[18] & 0xFF) << 8) | (png[19] & 0xFF)
                    int h = ((png[20] & 0xFF) << 24) | ((png[21] & 0xFF) << 16) | ((png[22] & 0xFF) << 8) | (png[23] & 0xFF)
                    if (w > 0) frameCount = h.intdiv(w)
                }

                String text = zip.getInputStream(zip.getEntry(entryName)).withCloseable { it.getText('UTF-8') }
                def frames = []   // [index, time], in .txt order
                try {
                    text.readLines().each { String rawLine ->
                        String line = rawLine.trim()
                        if (line.isEmpty()) return
                        line.split(',').each { String token ->
                            int star = token.indexOf('*')
                            if (star > 0) {
                                frames << [Integer.parseInt(token.substring(0, star)), Integer.parseInt(token.substring(star + 1))]
                            } else {
                                frames << [Integer.parseInt(token), 1]
                            }
                        }
                    }
                } catch (NumberFormatException e) {
                    logger.warn("${entryName}: animation list stops at a malformed entry (${e.message}), as in 1.5.2")
                }

                String json
                if (frames.isEmpty() || frames.size() >= 600) {
                    json = '{\n  "animation": {}\n}\n'
                } else {
                    int shown = 0   // the frame on screen; 1.5.2 starts on frame 0
                    def lines = frames.collect { f ->
                        int index = f[0] as int
                        if (index < 0 || (frameCount > 0 && index >= frameCount)) index = shown
                        shown = index
                        '      {"index": ' + index + ', "time": ' + Math.max(1, f[1] as int) + '}'
                    }
                    json = '{\n  "animation": {\n    "frames": [\n' + lines.join(',\n') + '\n    ]\n  }\n}\n'
                }

                File dest = new File(destByPrefix[prefix], baseName.toLowerCase(Locale.ROOT) + '.png.mcmeta')
                total++
                if (!dest.isFile() || dest.getText('UTF-8').replace('\r\n', '\n') != json) {
                    dest.parentFile.mkdirs()
                    dest.setText(json, 'UTF-8')
                    written++
                }
            }
        }
        logger.lifecycle("Converted ${total} BTW texture animation(s) to .png.mcmeta (${written} written)")
    }
}

// ============================================================
// 1.5.2 sound names -> assets/betterthanwolves/sounds.json (audit S4)
// One sound event per 1.5.2 sound name. btw.forge.LegacySounds registers a SoundEvent per key and
// resolves every FC legacy sound name through them. Each event plays its 1.5.2 file pool:
//  - every 1.5.2 sound file (pre-1.6 asset index, sound3/<path>.ogg; 1.5.2 loads only sound3 as sound
//    effects, vanilla/client Minecraft.java:2098-2106) joins the pool named by its path with the
//    trailing digits removed and '/' -> '.' ("mob/cow/say4.ogg" -> "mob.cow.say"), and a numbered
//    file also gets a pool of its own ("mob.cow.say4"): vanilla/client SoundPool.addSound + FCMOD;
//  - each file is the 1.20.1 vanilla file at the same path or, where Mojang renamed it, the 1.20.1
//    file with the identical SHA-1: mob/zombiepig/* -> mob/zombified_piglin/*, fireworks/largeBlast*
//    -> largeblast*, "mob/ghast/affectionate scream" and "random/wood click" -> underscores;
//  - names 1.5.2 played without any file (mob.villager.default*, mob.witch.*, damage.thorns,
//    mob.attack) get no event: they were silent in 1.5.2 and stay silent (LegacySounds.SILENT_IN_1_5_2);
//  - subtitles (1.5.2 had none) reuse 1.20.1's own subtitle keys; see the rules at subtitleOverrides.
// Keys are lower case with spaces as '_' (resource paths); LegacySounds.toKey applies the same rule.
// Not wired into the build: the checked-in sounds.json is what ships, so builds stay offline-safe.
// Rerun by hand after changing these rules (needs both asset indexes on disk).
// ============================================================
task generateLegacySoundsJson {
    description = 'Regenerates assets/betterthanwolves/sounds.json (one sound event per 1.5.2 sound name)'
    group = 'btw'

    def legacyIndexFile = file("${rootProject.projectDir}/.gradle/mc-cache/assets/pre-1.6.json")
    def assetsDir = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/assets')
    def outFile = file('src/main/resources/assets/betterthanwolves/sounds.json')
    outputs.upToDateWhen { false }

    doLast {
        def modernIndexFile = new File(assetsDir, 'indexes/5.json')   // 1.20.1's asset index id is "5"
        if (!legacyIndexFile.isFile() || !modernIndexFile.isFile()) {
            throw new GradleException("generateLegacySoundsJson needs ${legacyIndexFile} (run :downloadLegacyResources) " +
                    "and ${modernIndexFile} (run :Forge:runClient once)")
        }
        def slurper = new groovy.json.JsonSlurper()
        def legacyObjects = slurper.parse(legacyIndexFile).objects
        def modernObjects = slurper.parse(modernIndexFile).objects
        def validPath = ~/[a-z0-9\/._-]+/

        // 1.20.1 sound files by path, and by content (first path in sorted order)
        def modernHashByPath = new TreeMap<String, String>()
        modernObjects.each { String k, v ->
            if (k.startsWith('minecraft/sounds/') && k.endsWith('.ogg')) {
                modernHashByPath[k.substring('minecraft/sounds/'.length())] = v.hash as String
            }
        }
        def modernPathByHash = [:]
        modernHashByPath.each { String p, String h ->
            if (!modernPathByHash.containsKey(h)) modernPathByHash[h] = p
        }

        // 1.5.2 pools (SoundPool.addSound): key -> 1.20.1 files
        def pools = new TreeMap<String, TreeSet<String>>()
        new TreeSet<String>(legacyObjects.keySet()).each { String k ->
            if (!k.startsWith('sound3/') || !k.endsWith('.ogg')) return
            String rel = k.substring('sound3/'.length())
            String name = rel.substring(0, rel.indexOf('.'))
            String target = modernHashByPath.containsKey(rel) ? rel : modernPathByHash[legacyObjects[k].hash as String]
            if (target != null && !(target ==~ validPath)) target = null
            def names = []
            if (Character.isDigit(name.charAt(name.length() - 1))) names << name.replace('/', '.')
            String base = name
            while (base.length() > 1 && Character.isDigit(base.charAt(base.length() - 1))) {
                base = base.substring(0, base.length() - 1)
            }
            names << base.replace('/', '.')
            names.each { String n ->
                String key = n.toLowerCase(Locale.ROOT).replace(' ', '_')
                if (!pools.containsKey(key)) pools[key] = new TreeSet<String>()
                if (target != null) pools[key] << ('minecraft:' + target.substring(0, target.length() - '.ogg'.length()))
            }
        }

        // Subtitles, from 1.20.1's own sounds.json
        def vanillaEvents = [:]
        String vanillaSoundsHash = modernObjects['minecraft/sounds.json']?.hash
        if (vanillaSoundsHash != null) {
            def vanillaSoundsFile = new File(assetsDir, "objects/${vanillaSoundsHash.substring(0, 2)}/${vanillaSoundsHash}")
            if (vanillaSoundsFile.isFile()) vanillaEvents = slurper.parse(vanillaSoundsFile)
        }
        def filesOf = { event ->
            def files = new TreeSet<String>()
            event.sounds?.each { s ->
                String n = (s instanceof Map) ? (((s.type ?: 'file') == 'file') ? s.name : null) : s
                if (n != null) files << (n.contains(':') ? n : 'minecraft:' + n)
            }
            files
        }
        def subtitleByFiles = [:]   // file set -> subtitle, '' when two subtitles share the files
        def vanillaSubtitles = new HashSet<String>()   // keys 1.20.1 translates
        new TreeSet<String>(vanillaEvents.keySet()).each { String ev ->
            String sub = vanillaEvents[ev].subtitle
            if (sub == null) return
            vanillaSubtitles << sub
            def files = filesOf(vanillaEvents[ev])
            if (!subtitleByFiles.containsKey(files)) subtitleByFiles.put(files, sub)
            else if (subtitleByFiles.get(files) != sub) subtitleByFiles.put(files, '')
        }

        // A sound's subtitle is, in order:
        //  1. the one subtitle of the 1.20.1 event(s) that play exactly its files;
        //  2. else its subtitleOverrides / subtitlePrefixes entry. 1.20.1 plays many 1.5.2 pools as
        //     several events (dig.stone is block.stone.break and .place, step.stone .step and .hit,
        //     random.fuse creeper and TNT priming), so the entry names what 1.5.2 played the sound for;
        //     a few entries cover 1.5.2 files no 1.20.1 event plays any more (chest, door, note);
        //  3. else, for a numbered name ("mob.cow.say4"), the subtitle of its pool ("mob.cow.say").
        // No subtitle: random.click (buttons, levers, plates, FC cranks alike), the ghast "affectionate
        // scream" (also FCEntityWitch's idle sound), and the names 1.20.1 has no subtitle for either
        // (mob.wolf.howl, portal.travel, random.breath, minecart.inside, mob.bat.loop).
        def subtitleOverrides = [
            'ambient.cave.cave'    : 'subtitles.ambient.cave',
            'damage.hit'           : 'subtitles.entity.generic.hurt',   // EntityLiving's default hurt sound
            'fire.fire'            : 'subtitles.block.fire.ambient',
            'mob.cat.hitt'         : 'subtitles.entity.cat.hurt',
            'mob.chicken.hurt'     : 'subtitles.entity.chicken.hurt',
            'mob.chicken.plop'     : 'subtitles.entity.chicken.egg',
            'mob.cow.hurt'         : 'subtitles.entity.cow.hurt',
            'mob.enderdragon.growl': 'subtitles.entity.ender_dragon.growl',
            'mob.endermen.portal'  : 'subtitles.entity.enderman.teleport',
            'mob.ghast.fireball'   : 'subtitles.entity.ghast.shoot',
            'mob.pig.say'          : 'subtitles.entity.pig.ambient',
            'mob.sheep.say'        : 'subtitles.entity.sheep.ambient',
            'mob.sheep.shear'      : 'subtitles.item.shears.shear',
            'mob.silverfish.hit'   : 'subtitles.entity.silverfish.hurt',
            'mob.silverfish.kill'  : 'subtitles.entity.silverfish.death',
            'mob.silverfish.say'   : 'subtitles.entity.silverfish.ambient',
            'mob.slime.big'        : 'subtitles.entity.slime.squish',
            'mob.slime.small'      : 'subtitles.entity.slime.squish',
            'mob.spider.say'       : 'subtitles.entity.spider.ambient',
            'mob.zombie.woodbreak' : 'subtitles.entity.zombie.break_wooden_door',
            'note.bass'            : 'subtitles.block.note_block.note',
            'note.harp'            : 'subtitles.block.note_block.note',
            'random.anvil_land'    : 'subtitles.block.anvil.land',
            'random.bow'           : 'subtitles.entity.arrow.shoot',
            'random.bowhit'        : 'subtitles.entity.arrow.hit',
            'random.chestclosed'   : 'subtitles.block.chest.close',
            'random.chestopen'     : 'subtitles.block.chest.open',
            'random.classic_hurt'  : 'subtitles.entity.generic.hurt',
            'random.door_close'    : 'subtitles.block.door.toggle',
            'random.door_open'     : 'subtitles.block.door.toggle',
            'random.explode'       : 'subtitles.entity.generic.explode',
            'random.fizz'          : 'subtitles.block.fire.extinguish',
            'random.fuse'          : 'subtitles.entity.tnt.primed',   // TNT, creeper, FC charges and dynamite
            'random.glass'         : 'subtitles.block.generic.break',
            'random.pop'           : 'subtitles.entity.item.pickup'
        ]
        def subtitlePrefixes = [
            'dig.' : 'subtitles.block.generic.break',      // a block's break and place sound in 1.5.2
            'step.': 'subtitles.block.generic.footsteps'   // ProxyBlock also plays it as the hit and fall sound
        ]
        [subtitleOverrides, subtitlePrefixes].each { Map table ->
            table.each { String name, String sub ->
                if (!vanillaSubtitles.contains(sub)) {
                    throw new GradleException("generateLegacySoundsJson: ${sub} (for ${name}) is not a 1.20.1 subtitle key")
                }
            }
        }
        subtitleOverrides.each { String name, String sub ->
            if (!pools[name]) throw new GradleException("generateLegacySoundsJson: subtitle for unknown 1.5.2 sound ${name}")
            if (subtitleByFiles.get(pools[name])) logger.warn("generateLegacySoundsJson: subtitle override for ${name} is unused")
        }
        def chosenSubtitle = { String key ->
            String sub = subtitleOverrides[key]
            if (sub == null) sub = subtitlePrefixes.find { String prefix, String s -> key.startsWith(prefix) }?.value
            sub
        }
        def subtitleOf = { String key, TreeSet<String> files ->
            String sub = subtitleByFiles.get(files) ?: chosenSubtitle(key)
            if (!sub) {
                String base = key
                while (base.length() > 1 && Character.isDigit(base.charAt(base.length() - 1))) {
                    base = base.substring(0, base.length() - 1)
                }
                if (base != key && pools[base]) sub = subtitleByFiles.get(pools[base]) ?: chosenSubtitle(base)
            }
            sub ?: null
        }

        def json = new StringBuilder('{\n')
        int emitted = 0
        def silent = []
        for (String key : pools.keySet()) {
            TreeSet<String> files = pools[key]
            if (files.isEmpty()) {
                silent << key   // no 1.20.1 file: LegacySounds resolves it to null
                continue
            }
            String body = files.collect { '      "' + it + '"' }.join(',\n')
            String subtitle = subtitleOf(key, files)
            if (emitted++ > 0) json.append(',\n')
            json.append('  "').append(key).append('": {\n    "sounds": [\n').append(body).append('\n    ]')
            if (subtitle) json.append(',\n    "subtitle": "').append(subtitle).append('"')
            json.append('\n  }')
        }
        json.append('\n}\n')

        String text = json.toString()
        if (!outFile.isFile() || outFile.getText('UTF-8').replace('\r\n', '\n') != text) {
            outFile.parentFile.mkdirs()
            outFile.setText(text, 'UTF-8')
            logger.lifecycle("generateLegacySoundsJson: wrote ${emitted} sound events to ${outFile}")
        } else {
            logger.lifecycle("generateLegacySoundsJson: ${outFile.name} is up to date (${emitted} sound events)")
        }
        if (!silent.isEmpty()) {
            logger.warn("generateLegacySoundsJson: no 1.20.1 file for ${silent}; they stay silent")
        }
    }
}

// Run before processResources so textures are in place for the build
processResources.dependsOn lowercaseModelRefs
processResources.dependsOn generateBtwTextureAnimations

// Template placeholders in META-INF/mods.toml so users can see which
// upstream BTW build is embedded. We use a targeted string-replace
// rather than Groovy's expand() because ${file.jarVersion} is handled
// by Forge's mod-loading runtime — expand() would try to resolve it
// at build time and fail.
processResources {
    def replacements = [
        '${btw_version}'     : project.btwVersion,
        '${port_version}'    : project.portVersion,
        '${port_mc_version}' : project.portMcVersion,
    ]
    inputs.properties(replacements.collectEntries { k, v -> [(k): v] })
    filesMatching('META-INF/mods.toml') {
        filter { String line ->
            replacements.inject(line) { acc, k, v -> acc.replace(k, v) }
        }
    }
}

// Modern woods (acacia, dark oak, mangrove, cherry as FC wood types 5-8): work-stump side textures derived from FC's own
// art and the 1.20.1 logs, checked in, rewritten only when the bytes differ. Owned by the modern-woods workstream.
apply from: 'gradle/modern-woods.gradle'

// Legacy icon textures (1.5.2 icons 1.20.1 draws from several textures: redstoneDust_cross) composed from 1.20.1's own
// textures, checked in, rewritten only when the pixels change. Owned by the FOUND-R3 TEXTURES unit.
apply from: 'gradle/legacy-icon-textures.gradle'
